<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ColorGlass Financeiro</title>
<link rel="stylesheet" href="/finance-erp.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CG</div>
      <div><b>ColorGlass</b><span>Financeiro</span></div>
    </div>
    <nav id="nav">
      <button class="nav-item active" data-view="overview">Visão Geral</button>
      <button class="nav-item" data-view="bank">Banco</button>
      <button class="nav-item" data-view="reconciliation">Conciliação</button>
      <button class="nav-item" data-view="receivables">A Receber</button>
      <button class="nav-item" data-view="payables">A Pagar</button>
      <button class="nav-item" data-view="cashflow">Fluxo de Caixa</button>
      <button class="nav-item" data-view="dre">DRE</button>
      <button class="nav-item" data-view="chart">Plano de Contas</button>
    </nav>
    <div class="sidebar-foot">
      <span class="dot"></span>
      <div><b>Local only</b><small>127.0.0.1:8770</small></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Visão Geral</h1>
        <p id="pageSubtitle">Posição financeira consolidada da ColorGlass.</p>
      </div>
      <div class="actions">
        <div class="period">
          <input id="dateFrom" type="date">
          <span>até</span>
          <input id="dateTo" type="date">
        </div>
        <button id="refreshBtn" class="button ghost">Atualizar</button>
        <button id="refreshReceivablesBtn" class="button primary">Atualizar ERP</button>
      </div>
    </header>

    <div id="sourceBanner" class="source-banner hidden"></div>
    <section id="content" class="content">
      <div class="loading">Carregando financeiro real...</div>
    </section>
  </main>
</div>

<dialog id="accountDialog" class="account-dialog">
  <form id="accountForm" class="account-form">
    <div class="account-dialog-head">
      <div><b>Criar conta</b><span>Adicione ao plano de contas sem sair da conciliação.</span></div>
      <button type="button" id="accountCancelX" class="dialog-x" aria-label="Fechar">×</button>
    </div>
    <div class="account-form-grid">
      <label><span>Código</span><input id="accountCode" placeholder="1.1.02" required></label>
      <label class="wide"><span>Nome</span><input id="accountName" placeholder="Ex.: Adiantamento a funcionário" required></label>
      <label><span>Natureza</span><select id="accountNature"><option value="asset">Ativo</option><option value="liability">Passivo</option><option value="income">Receita</option><option value="expense">Despesa</option><option value="equity">Patrimônio</option><option value="transfer">Transferência</option><option value="other">Outro</option></select></label>
      <label><span>DRE</span><select id="accountDre"><option value="non_dre">Não entra na DRE</option><option value="revenue">Receita</option><option value="cogs">CMV</option><option value="opex">Despesa operacional</option><option value="financial">Financeiro</option><option value="taxes">Impostos</option></select></label>
      <label><span>Fluxo de caixa</span><select id="accountCashflow"><option value="operating">Operacional</option><option value="investing">Investimento</option><option value="financing">Financiamento</option><option value="transfer">Transferência</option><option value="unclassified">Não classificado</option></select></label>
    </div>
    <div id="accountError" class="form-error hidden"></div>
    <div class="account-dialog-actions">
      <button type="button" id="accountCancel" class="button ghost">Cancelar</button>
      <button type="submit" id="accountSave" class="button primary">Criar conta</button>
    </div>
  </form>
</dialog>
<script src="/finance-erp.js"></script>
</body>
</html>
