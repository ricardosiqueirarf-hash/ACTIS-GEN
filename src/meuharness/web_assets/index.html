function bindMonsterEyeTracking(){if(window.__actisEyeTracking)return;window.__actisEyeTracking=true;const reset=()=>document.querySelectorAll('.pixel-monster[data-follow-eyes="1"]').forEach(m=>{m.style.setProperty('--look-x','0px');m.style.setProperty('--look-y','0px')});const dir=v=>v<-.28?-1:v>.28?1:0;const paint=(mx,my)=>{document.querySelectorAll('.pixel-monster[data-follow-eyes="1"]').forEach(m=>{const r=m.getBoundingClientRect();if(!r.width||!r.height)return;const nx=(mx-(r.left+r.width/2))/(r.width/2),ny=(my-(r.top+r.height/2))/(r.height/2);const step=m.classList.contains('mini')?1:m.classList.contains('chat-monster')?1:2;m.style.setProperty('--look-x',`${dir(nx)*step}px`);m.style.setProperty('--look-y',`${dir(ny)*step}px`)})};document.addEventListener('mousemove',e=>paint(e.clientX,e.clientY),{passive:true});document.documentElement.addEventListener('mouseleave',reset);window.addEventListener('blur',reset);document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()})}

function drawWorkflowEdges(){const canvas=document.querySelector('.workflow-canvas');if(!canvas||!wfState.current)return;canvas.querySelectorAll('.wf-edge,.wf-edge-label').forEach(x=>x.remove());for(const e of wfState.current.edges||[]){const a=canvas.querySelector(`[data-wf-node="${CSS.escape(e.from)}"]`),b=canvas.querySelector(`[data-wf-node="${CSS.escape(e.to)}"]`);if(!a||!b)continue;const x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft,y2=b.offsetTop+b.offsetHeight/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;const line=document.createElement('div');line.className='wf-edge '+(e.branch||'next');line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=len+'px';line.style.transform=`rotate(${ang}deg)`;canvas.prepend(line);const lab=document.createElement('button');lab.type='button';lab.className='wf-edge-label';lab.style.left=((x1+x2)/2-18)+'px';lab.style.top=((y1+y2)/2-8)+'px';lab.textContent=(e.branch||'next').toUpperCase();lab.title='Clique para remover esta conexão';lab.onclick=ev=>{ev.stopPropagation();removeWorkflowEdge(e.id)};canvas.appendChild(lab)}}

function addWorkflowNode(type='agent'){if(!wfState.current)return;if(type==='start'&&(wfState.current.nodes||[]).some(n=>n.type==='start')){alert('Este workflow já possui um Start.');return}const nodes=wfState.current.nodes||[],idx=nodes.length,node={id:crypto.randomUUID(),type,label:type==='condition'?'Nova condição':type==='agent'?'Nova etapa':'',agent_id:type==='agent'?(agents[0]?.id||null):null,prompt:type==='agent'?'{{previous}}':'',condition:type==='condition'?'contains: aprovado':'',x:100+(idx%3)*245,y:110+Math.floor(idx/3)*135};nodes.push(node);wfState.current.nodes=nodes;const selected=wfState.current.nodes.find(n=>n.id===wfState.selectedNode);if(selected&&selected.type!=='end'&&type!=='start'){const branch=selected.type==='condition'?'true':'next',old=(wfState.current.edges||[]).find(e=>e.from===selected.id&&e.branch===branch);if(old){old.from=node.id;old.branch=type==='condition'?'true':'next';wfState.current.edges.push({id:crypto.randomUUID(),from:selected.id,to:node.id,branch})}else{wfState.current.edges.push({id:crypto.randomUUID(),from:selected.id,to:node.id,branch})}}wfState.selectedNode=node.id;markWorkflowDirty();renderWorkflowEditor()}

function bindWorkflowAssistant(){const inp=document.querySelector('#wfAssistantInput');if(!inp)return;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendWorkflowAssistant()}};const box=document.querySelector('#wfAssistantMessages');if(box)box.scrollTop=box.scrollHeight;}
async function askWorkflowAssistant(text){const inp=document.querySelector('#wfAssistantInput');if(inp){inp.value=text;inp.focus()}await sendWorkflowAssistant(text);}
async function sendWorkflowAssistant(forcedText=''){if(wfState.assistantPending||!wfState.current)return;const inp=document.querySelector('#wfAssistantInput'),question=String(forcedText||inp?.value||'').trim();if(!question)return;wfState.assistantMessages.push({role:'user',content:question});wfState.assistantPending=true;const panel=document.querySelector('.wf-assistant');if(panel){panel.outerHTML=workflowAssistantHtml();bindWorkflowAssistant()}try{const prior=wfState.assistantMessages.slice(0,-1).slice(-10).map(m=>({role:m.role,content:m.content}));const prompt=`${workflowAssistantContextText()}\n\nPERGUNTA DO USUÁRIO:\n${question}`;const history=[...prior,{role:'user',content:prompt}];const currentId=wfState.current?.id||null;const j=await api('/api/agents/assistente-de-workflow/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({history,source:'user'})});wfState.assistantMessages.push({role:'assistant',content:j.text||'Sem resposta.'});const fresh=(await api('/api/workflows')).workflows||[];wfState.items=fresh;if(currentId){const updated=fresh.find(x=>x.id===currentId);if(updated){wfState.current=updated;wfState.dirty=false;wfState.validation=workflowLocalValidation(updated);wfState.runs=(await api('/api/workflows/'+encodeURIComponent(currentId)+'/runs')).runs||[]}}renderWorkflows()}catch(e){wfState.assistantMessages.push({role:'assistant',content:'Erro ao consultar o assistente: '+e.message})}finally{wfState.assistantPending=false;const current=document.querySelector('.wf-assistant');if(current){current.outerHTML=workflowAssistantHtml();bindWorkflowAssistant()}}}
async function renderWorkflows(){stopWorld();stopOpsTimer();currentView='workflows';selected=null;title.textContent='Workflows';await loadWorkflows();if(!wfState.current&&wfState.items.length){wfState.current=wfState.items[0];wfState.dirty=false;await loadWorkflows()}content.innerHTML=`<div class="wf3-page"><div class="wf3-head"><div><h1>Workflow Studio</h1><p>Construa uma sequência: início → agentes → decisões → fim. Clique nos blocos para configurar.</p></div><span class="wf3-count">${wfState.items.length} workflow${wfState.items.length===1?'':'s'}</span><button class="primary" onclick="createWorkflowUI('basic')">+ Novo workflow</button></div><div class="workflow-shell"><aside class="workflow-list"><div class="wf3-side-title"><span>Seus workflows</span></div><div class="wf3-template-stack"><button class="wf3-template" onclick="createWorkflowUI('basic')"><b>▶ Novo fluxo básico</b><small>Start → Agente → End</small></button><button class="wf3-template" onclick="createWorkflowUI('condition')"><b>◇ Novo com decisão</b><small>Start → Agente → Condição → End</small></button></div><div class="wf3-side-title"><span>Salvos</span><span>${wfState.items.length}</span></div>${wfState.items.map(w=>`<button class="wf-list-card ${wfState.current?.id===w.id?'active':''}" onclick="selectWorkflow('${w.id}')"><b>${esc(w.name)}</b><small>${(w.nodes||[]).length} etapas · ${(w.edges||[]).length} conexões</small></button>`).join('')||'<div class="empty">Nenhum workflow salvo.</div>'}</aside><main class="workflow-editor"></main><aside class="workflow-inspector"></aside></div>${workflowAssistantHtml()}</div>`;renderWorkflowEditor();bindWorkflowAssistant();updateWorkflowAssistantContext()}

function renderAbout(){
stopWorld();stopOpsTimer();currentView='about';selected=null;history=[];title.textContent='Sobre';
const toolRows=toolCatalog.map(t=>`<tr><td><b>${esc(t.name)}</b><br><code>${esc(t.id)}</code></td><td>${esc(t.kind||'tool')}</td><td>${esc(t.description||'')}</td><td>${(t.scopes||[]).map(x=>`<span class="docs-badge">${esc(x)}</span>`).join(' ')}</td></tr>`).join('');
content.innerHTML=`<div class="docs"><div class="docs-hero"><div class="docs-eyebrow">ACTIS GEN · estado auditado do working tree</div><h1>Control plane local para agentes de IA</h1><p>Infraestrutura comum para criar e operar agentes com modelo, contexto, memória, tools, scopes, automações e workflows sem construir um harness novo para cada domínio.</p><div class="docs-stats"><div class="docs-stat"><b>${agents.length}</b><span>Agentes</span></div><div class="docs-stat"><b>${models.length}</b><span>Modelos</span></div><div class="docs-stat"><b>${toolCatalog.length}</b><span>Tools</span></div><div class="docs-stat"><b>${companies.length}</b><span>Empresas</span></div></div></div>
<div class="docs-layout"><nav class="docs-toc"><strong>Documentação</strong><a href="#doc-visao">01 · Visão</a><a href="#doc-arquitetura">02 · Arquitetura</a><a href="#doc-agentes">03 · Agentes e conversas</a><a href="#doc-contexto">04 · Contexto e memória</a><a href="#doc-tools">05 · Tools e segurança</a><a href="#doc-autonomia">06 · Automações</a><a href="#doc-workflows">07 · Workflows</a><a href="#doc-observabilidade">08 · Runs e eventos</a><a href="#doc-modelos">09 · 9Router</a><a href="#doc-dados">10 · Persistência</a><a href="#doc-interface">11 · Interface</a><a href="#doc-api">12 · API</a><a href="#doc-operacao">13 · Operação</a><a href="#doc-validacao">14 · Validação</a><a href="#doc-limites">15 · Limites reais</a></nav><main>
<section class="docs-section" id="doc-visao"><h2>01 · Visão</h2><p><b>ACTIS GEN</b> generaliza infraestrutura e especializa agente, conhecimento, estado, contexto, permissões e tools. MAF executa o agente; 9Router resolve provider/modelo; MCPs operam software e sistema.</p><div class="docs-code">generalizar infraestrutura\nespecializar agente + conhecimento + estado + contexto + permissions + tools</div><div class="docs-note"><b>Estado desta página:</b> descreve o working tree auditado em 2026-09-15, não apenas o último commit.</div></section>
<section class="docs-section" id="doc-arquitetura"><h2>02 · Arquitetura</h2><div class="docs-code">Conversation / World / Direct Chat / Automation / Workflow / Delegation\n                               ↓\n                         execute_agent()\n                               ↓\n          contexto + memória + scopes + tools + timeout\n                               ↓\n                     Harness Core → MAF\n                               ↓\n                           9Router\n                               ↓\n                      provider / modelo\n                               ↘\n             Browser / Files / Terminal / Computer</div><p><code>execution_service.py</code> é o kernel canônico. Chat, automação, workflow e delegação não possuem engines paralelas.</p><p>O chat direto/global usa exclusão por agente: o mesmo agente não recebe duas requisições simultâneas nesse caminho, mas agentes diferentes podem trabalhar em paralelo. Computer Use aceita somente uma Run ativa por vez.</p></section>
<section class="docs-section" id="doc-agentes"><h2>03 · Agentes e conversas</h2><p>Agentes persistem identidade, aparência, empresa/setor, modelo, instruções, tools, <code>permissions</code>, memória, status e timestamps.</p><p><b>Conversation ≠ Run.</b> Conversas persistem mensagens; cada envio cria uma Run vinculada. Até 16 mensagens anteriores válidas entram no contexto da próxima execução.</p><p>O <code>general</code> recebe ACTIS Admin e pode administrar agentes, modelos, Runs, automações e delegações com tools <code>actis_*</code>.</p></section>
<section class="docs-section" id="doc-contexto"><h2>04 · Contexto e memória</h2><h3>Contexto hierárquico</h3><div class="docs-code">empresa → setor → projeto → agente</div><p>Projetos são ligados ao agente por bindings. Contextos têm kind, prioridade, pinned e estado ativo. Pinned entra sempre; os demais usam relevância lexical + prioridade.</p><h3>Memória persistente</h3><p>Quando <code>memory=true</code>, Runs concluídas gravam memória cross-conversation em SQLite. Retrieval usa FTS5 e fallback por recência; até 6 memórias podem ser injetadas por Run. Ainda não há embeddings/vetores.</p></section>
<section class="docs-section" id="doc-tools"><h2>05 · Tools, scopes e segurança</h2><p>Tools são capabilities; scopes controlam operações. A configuração permanente do agente pode escolher scopes individualmente e approvals aprovados adicionam scopes dinamicamente.</p><table class="docs-table"><tr><th>Tool</th><th>Tipo</th><th>Descrição</th><th>Scopes</th></tr>${toolRows}</table><div class="docs-code">browser.read / browser.interact\nfiles.read / files.write\nterminal.exec\ncomputer.view / computer.control\nactis.admin</div><p>Browser, Files e Computer filtram as operações MCP reais. Ex.: <code>files.read</code> não expõe escrita; <code>computer.view</code> não expõe clique/digitação.</p><h3>Approvals</h3><p>Capacidade ausente pode ser solicitada com <code>ACTIS_APPROVAL_REQUEST: scope</code>. A aba Approvals permite aprovar, negar e revogar.</p></section>
<section class="docs-section" id="doc-autonomia"><h2>06 · Automações</h2><p>Triggers: <code>interval</code>, <code>daily</code>, <code>once</code> e <code>condition</code>. O scheduler executa diretamente <code>execute_agent()</code>; conditions são avaliadas pelo General com <code>ACTIS_TRIGGER</code>/<code>ACTIS_WAIT</code>.</p><p>O scheduler é processo independente e, neste computador, está ativo como <code>actis-gen-scheduler.service</code>. Reiniciar o web não encerra o scheduler.</p></section>
<section class="docs-section" id="doc-workflows"><h2>07 · Workflows</h2><p>Workflows já são <b>executáveis</b>. A UI possui editor, inspector, validação, execução e histórico.</p><div class="docs-code">Start → Agent → Condition(true/false) → Agent → End</div><p>Agent nodes usam <code>execute_agent()</code>. Conditions aceitam <code>contains:</code>, <code>not contains:</code>, <code>equals:</code> ou substring. Prompts aceitam <code>{{input}}</code>, <code>{{previous}}</code> e <code>{{node.label}}</code>. Há limite de 50 etapas contra loops.</p><p>Workflow Runs persistem input, output, erro e trace por nó em <code>workflow_runs</code>.</p></section>
<section class="docs-section" id="doc-observabilidade"><h2>08 · Runs e eventos</h2><div class="docs-code">run.started → [run.heartbeat]* → run.completed | run.failed | run.cancelled</div><p>Runs podem ser canceladas. Computer Use publica heartbeat a cada 10 s e recebe deadline mínimo de 300 s. O Event Bus é persistente em SQLite e a aba Eventos atualiza aproximadamente a cada 2 s.</p></section>
<section class="docs-section" id="doc-modelos"><h2>09 · Modelos e 9Router</h2><p>9Router continua responsável por provider auth, catálogo, routing e fallback. O ACTIS GEN escolhe o ID configurado no agente e não implementa fallback próprio.</p><ul><li><b>Model probe:</b> completion real sem depender da sessão administrativa do dashboard.</li><li><b>Provider diagnostics:</b> detalhes administrativos que podem depender da sessão do 9Router.</li></ul></section>
<section class="docs-section" id="doc-dados"><h2>10 · Persistência</h2><p>Fonte canônica: <code>~/.local/share/actis-gen/actis.db</code>, SQLite WAL.</p><div class="docs-code">collections → agents / runs / companies / sectors / conversations / automations / context / projects / bindings\nevents\nmemories + memories_fts\napprovals\nworkflows\nworkflow_runs</div><p>JSON/JSONL antigos são legado de migração e só são importados quando a collection correspondente ainda está vazia.</p></section>
<section class="docs-section" id="doc-interface"><h2>11 · Interface</h2><table class="docs-table"><tr><th>Aba</th><th>Estado atual</th></tr><tr><td>Agentes</td><td>Cadastro, configuração, conversas e chat.</td></tr><tr><td>World</td><td>Organização operacional, atividade e chat global.</td></tr><tr><td>Automações</td><td>Builder e gestão de rotinas.</td></tr><tr><td>Workflows</td><td>Editor, validação, execução e histórico.</td></tr><tr><td>Approvals</td><td>Aprovar, negar e revogar scopes.</td></tr><tr><td>Eventos</td><td>Telemetria live do Event Bus.</td></tr><tr><td>Runs</td><td>Ativas, histórico, logs e cancelamento.</td></tr><tr><td>Modelos</td><td>Catálogo, saúde, probe e providers.</td></tr><tr><td>Tools</td><td>Capabilities/scopes.</td></tr><tr><td>Empresas</td><td>Empresas, setores, projetos, contexto e drag/drop.</td></tr></table></section>
<section class="docs-section" id="doc-api"><h2>12 · API local</h2><p>A API cobre agentes, organizações, projects/context/bindings, conversations, automations, approvals, workflows e workflow runs, memory, Runs, Events, storage, models e providers.</p><p>Base padrão: <code>http://127.0.0.1:8765</code>. Não há autenticação/RBAC nesta versão.</p><div class="docs-note">Documentação detalhada no projeto: <code>docs/API.md</code>.</div></section>
<section class="docs-section" id="doc-operacao"><h2>13 · Operação local</h2><div class="docs-code">ACTIS web   127.0.0.1:8765\n9Router     127.0.0.1:20128\nBrowser CDP  dinâmico por agente (9222–9822)\nScheduler   systemd --user active</div><p>Comandos: <code>actis-gen</code>, <code>actis-gen-web</code>, <code>actis-gen-scheduler</code> e <code>actis-gen-smoke</code>.</p><p>Branch auditado: <code>feat/runtime-foundation</code>, com várias mudanças ainda não commitadas.</p></section>
<section class="docs-section" id="doc-validacao"><h2>14 · Validação real</h2><div class="docs-code">pytest -q → 48 passed\nruff check src/meuharness tests → OK</div><p>O código ACTIS está com lint limpo no escopo <code>src/meuharness + tests</code>.</p><div class="docs-note docs-warn"><b>Correção documental:</b> a afirmação antiga “Ruff OK” estava desatualizada. <code>ruff check .</code> também não deve ser usado como métrica do ACTIS porque varre o clone upstream com configuração própria.</div></section>
<section class="docs-section" id="doc-limites"><h2>15 · Limites reais</h2><ul><li>Sistema local single-user, sem auth/RBAC/tenancy.</li><li>Memória sem embeddings/vetores.</li><li>Workflow engine é sequencial; não há fan-out/fan-in/paralelismo nativo.</li><li>Conditions de workflow são simples, não um expression engine completo.</li><li>Instalação systemd do scheduler é específica desta máquina.</li><li>Muitas entidades ainda usam JSON payload em <code>collections</code>.</li><li>A API local não deve ser exposta publicamente no estado atual.</li><li>Working tree ainda precisa de consolidação Git e dos 4 findings de lint.</li></ul></section>
</main></div></div>`}


function renderObjective(){
stopWorld();stopOpsTimer();currentView='objective';selected=null;history=[];title.textContent='Objetivo';
content.innerHTML=`<div class="docs"><div class="docs-hero"><div class="docs-eyebrow">ACTIS GEN · direção do produto</div><h1>Construir um sistema operacional para agentes</h1><p>O objetivo do ACTIS GEN é transformar agentes de IA em unidades operacionais persistentes, organizáveis e reutilizáveis: cada agente recebe identidade, modelo, contexto, memória, permissões, ferramentas e responsabilidades, enquanto o ACTIS coordena tudo em um único control plane.</p></div>
<div class="docs-layout"><nav class="docs-toc"><strong>Objetivos</strong><a href="#obj-norte">01 · Norte</a><a href="#obj-produto">02 · Produto final</a><a href="#obj-agentes">03 · Agentes</a><a href="#obj-orquestracao">04 · Orquestração</a><a href="#obj-integracoes">05 · Integrações</a><a href="#obj-autonomia">06 · Autonomia</a><a href="#obj-confiabilidade">07 · Confiabilidade</a><a href="#obj-metas">08 · Metas</a></nav><main>
<section class="docs-section" id="obj-norte"><h2>01 · Norte</h2><div class="docs-note"><b>Princípio central:</b> generalizar infraestrutura; especializar conhecimento, estado, ferramentas e regras de negócio.</div><p>Não queremos criar um harness novo para cada problema. Queremos que o ACTIS GEN consiga criar/configurar agentes e conectá-los a harnesses, MCPs, softwares e fontes de contexto já existentes.</p><div class="docs-code">SOFTWARE / DOMÍNIO\n        ↓\n    ACTIS GEN\n        ↓\n agentes + contexto + memória + permissões\n        ↓\n harnesses / MCPs / APIs / software real</div></section>
<section class="docs-section" id="obj-produto"><h2>02 · O que o produto deve se tornar</h2><p>Um <b>ERP / sistema operacional de força de trabalho de IA</b>. Empresas devem conseguir representar sua estrutura real dentro do ACTIS e alocar agentes como trabalhadores digitais.</p><div class="docs-code">EMPRESA\n├─ Comercial\n│  ├─ Atendimento\n│  ├─ Orçamentista\n│  └─ Follow-up\n├─ Financeiro\n│  ├─ Cobrança\n│  └─ Conciliação\n└─ Operações\n   ├─ PCP\n   └─ Compras</div><p>Cada agente deve ter responsabilidades claras, acesso apenas às capacidades necessárias e histórico auditável do que fez.</p></section>
<section class="docs-section" id="obj-agentes"><h2>03 · Agentes como entidades persistentes</h2><ul><li>identidade, função e aparência persistentes;</li><li>modelo configurável;</li><li>memória e contexto por empresa/setor/projeto;</li><li>tools e permissões granulares;</li><li>conversas independentes das Runs;</li><li>capacidade de delegar e receber tarefas de outros agentes;</li><li>estado operacional observável: idle, thinking, tool, blocked, waiting approval, completed.</li></ul></section>
<section class="docs-section" id="obj-orquestracao"><h2>04 · Orquestração</h2><p>O ACTIS deve permitir três formas complementares de trabalho:</p><ul><li><b>Conversa direta:</b> humano ↔ agente.</li><li><b>Delegação multiagente:</b> agente ↔ agente.</li><li><b>Workflows e automações:</b> execução coordenada sem intervenção constante do usuário.</li></ul><p>O World deve evoluir para uma visualização operacional real da rede de agentes, não apenas uma representação estética.</p></section>
<section class="docs-section" id="obj-integracoes"><h2>05 · Integrações</h2><p>O ACTIS GEN deve ser capaz de encaixar novos braços sem alterar o kernel: Browser, Files, Terminal, Computer Use, bancos, CRMs, ERPs, WhatsApp, e-mail, APIs e futuros MCPs.</p><div class="docs-note">Adicionar uma nova capacidade deve significar registrar um tool/harness e suas permissões — não criar outro sistema de agentes do zero.</div></section>
<section class="docs-section" id="obj-autonomia"><h2>06 · Autonomia com controle</h2><ul><li>automações recorrentes e condicionais;</li><li>workflows executáveis;</li><li>agentes capazes de agir sem supervisão contínua;</li><li>approvals humanos para capacidades sensíveis;</li><li>cancelamento, timeout e limites claros;</li><li>memória suficiente para continuidade entre sessões.</li></ul><p>Autonomia não significa liberdade irrestrita: toda ação relevante deve continuar observável, limitada por scopes e recuperável quando possível.</p></section>
<section class="docs-section" id="obj-confiabilidade"><h2>07 · Confiabilidade como requisito de produto</h2><p>Para o ACTIS virar infraestrutura real, uma Run não pode simplesmente desaparecer ou travar silenciosamente. O produto deve perseguir:</p><ul><li>Execution Engine única;</li><li>Event Bus e traces completos;</li><li>jobs duráveis e retomáveis;</li><li>idempotência para ações críticas;</li><li>retry controlado por política;</li><li>health checks de tools, modelos e serviços;</li><li>storage consistente e migrações versionadas;</li><li>testes de regressão para cada capability importante.</li></ul></section>
<section class="docs-section" id="obj-metas"><h2>08 · Metas</h2><table class="docs-table"><tr><th>Fase</th><th>Meta</th><th>Critério de sucesso</th></tr><tr><td>Agora</td><td>Consolidar kernel e operação local</td><td>Runs, memória, approvals, workflows, automações e tools funcionando sem caminhos paralelos.</td></tr><tr><td>Próxima</td><td>Agentes trabalhando em conjunto</td><td>Delegação, workflows, eventos e World refletindo atividade multiagente real.</td></tr><tr><td>Depois</td><td>Conectar softwares reais</td><td>Agentes operando CRM/ERP/WhatsApp/e-mail e sistemas internos por harnesses/APIs.</td></tr><tr><td>Produto</td><td>Multiempresa confiável</td><td>Auth, RBAC, isolamento de dados, auditoria e deployment reproduzível.</td></tr><tr><td>Visão final</td><td>Infraestrutura geral para trabalhadores digitais</td><td>Criar um agente útil passa a ser principalmente configurar função, contexto, modelo, tools e permissões.</td></tr></table><div class="docs-note"><b>Teste definitivo da visão:</b> se surgir um novo domínio, devemos conseguir criar agentes para ele sem construir um harness completo novo. O ACTIS deve reutilizar a infraestrutura existente e especializar apenas o necessário.</div></section>
</main></div></div>`}

function runLogText(r){return ['ACTIS GEN RUN LOG','id: '+(r.id||''),'status: '+(r.status||''),'agent_id: '+(r.agent_id||''),'model: '+(r.model||''),'source: '+(r.source||''),'conversation_id: '+(r.conversation_id||''),'automation_id: '+(r.automation_id||''),'started_at: '+(r.started_at||''),'finished_at: '+(r.finished_at||''),'elapsed_ms: '+(r.elapsed_ms??''),'prompt: '+(r.prompt||''),'response: '+(r.response||''),'error: '+(r.error||'')].join('\n')}
function runCard(r){const failed=r.status==='failed',running=r.status==='running',cancelled=r.status==='cancelled',log=runLogText(r),a=agents.find(x=>x.id===r.agent_id),showLog=failed||cancelled;return `<div class="run ${failed?'failed':''} ${running?'running':''} ${cancelled?'cancelled':''}"><strong>${esc(r.status||'')}</strong><br><small>${esc(a?.name||r.agent_id||'')} · ${esc(r.model||'')} · ${r.elapsed_ms??'-'} ms</small><div>${esc((r.prompt||'').slice(0,180))}</div>${showLog&&r.error?`<div class="run-error">${esc(r.error)}</div>`:''}<div class="run-actions">${running?`<button class="mini run-stop" onclick="cancelRunUI('${esc(r.id)}',this)">■ Parar</button>`:''}${showLog?`<button class="mini" onclick="toggleRunLog(this)">Ver log</button><button class="mini" data-log="${esc(log)}" onclick="copyRunLog(this)">Copiar log</button>`:''}</div>${showLog?`<pre class="run-log">${esc(log)}</pre>`:''}</div>`}
function toggleRunLog(btn){const box=btn.closest('.run').querySelector('.run-log'),open=box.classList.toggle('open');btn.textContent=open?'Ocultar log':'Ver log'}
async function copyRunLog(btn){const text=btn.dataset.log||'';try{await navigator.clipboard.writeText(text)}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=old,1200)}
function runPageRow(r){const a=agents.find(x=>x.id===r.agent_id)||{id:r.agent_id,name:r.agent_id||'Agente',avatar_color:'#64748b'},status=r.status||'unknown',log=runLogText(r),elapsed=r.elapsed_ms!=null?Math.round(r.elapsed_ms)+' ms':'—',source=r.source||'manual';return `<div class="run-row ${esc(status)}" data-run-row="${esc(r.id)}"><div class="run-rail"></div><div class="run-agent-icon">${pixelMonster(a,'mini')}</div><div class="run-main"><strong>${esc(a.name||r.agent_id||'Agente')}</strong><small>${esc(r.model||'modelo padrão')} · ${esc(source)}</small></div><div class="run-prompt" title="${esc(r.prompt||'')}">${esc(r.prompt||'Sem prompt')}</div><span class="run-status-pill">${esc(status)}</span><span class="run-time">${esc(elapsed)}</span><div class="run-row-actions">${status==='running'?`<button class="mini run-stop" onclick="cancelRunUI('${esc(r.id)}',this)">■ Parar</button>`:''}<button class="mini" onclick="toggleRunPageRow('${esc(r.id)}')">Detalhes</button><button class="mini" data-log="${esc(log)}" onclick="copyRunLog(this)">Copiar</button></div><div class="run-detail">${r.error?`<div class="run-detail-error">${esc(r.error)}</div>`:''}<div class="run-detail-log">${esc(log)}</div></div></div>`}
function toggleRunPageRow(id){document.querySelector(`[data-run-row="${CSS.escape(id)}"]`)?.classList.toggle('open')}
async function renderRuns(){stopWorld();stopRunPolling();currentView='runs';selected=null;title.textContent='Runs';try{const j=await api('/api/runs'),runs=j.runs||[],active=runs.filter(r=>r.status==='running'),history=runs.filter(r=>r.status!=='running'),completed=history.filter(r=>r.status==='completed').length,failed=history.filter(r=>r.status==='failed').length,cancelled=history.filter(r=>r.status==='cancelled').length;content.innerHTML=`<div class="runs-page"><div class="runs-page-head"><div><h1>Execuções</h1><p>Visão operacional das runs do ACTIS GEN. Ativas podem ser interrompidas sem afetar o histórico.</p></div><span class="runs-live">● LIVE</span></div><div class="runs-summary"><div class="runs-summary-item active"><span>Ativas</span><b>${active.length}</b></div><div class="runs-summary-item ok"><span>Concluídas</span><b>${completed}</b></div><div class="runs-summary-item bad"><span>Falhas</span><b>${failed}</b></div><div class="runs-summary-item"><span>Canceladas</span><b>${cancelled}</b></div></div><section class="runs-section"><div class="runs-section-head"><strong>Em execução</strong><span>${active.length} ativa${active.length===1?'':'s'}</span></div>${active.length?`<div class="runs-table">${active.map(runPageRow).join('')}</div>`:'<div class="runs-section-empty">Nenhuma execução ativa.</div>'}</section><section class="runs-section"><div class="runs-section-head"><strong>Histórico</strong><span>${history.length} registros</span></div>${history.length?`<div class="runs-table runs-history-list">${history.map(runPageRow).join('')}</div>`:'<div class="runs-section-empty">Nenhuma execução finalizada ainda.</div>'}</section></div>`}catch(e){content.innerHTML=`<div class="empty">Falha ao carregar runs: ${esc(e.message)}</div>`}}
function automationAgent(a){return agents.find(x=>x.id===a.agent_id)}
function automationTriggerLabel(a){if(a.trigger_type==='interval')return `A cada ${Math.max(1,Math.round((a.interval_seconds||3600)/60))} min`;if(a.trigger_type==='daily')return `Diariamente · ${a.daily_time||'09:00'}`;if(a.trigger_type==='once')return `Uma vez · ${a.once_at?new Date(a.once_at).toLocaleString():''}`;if(a.trigger_type==='condition')return `Condição · ${Math.max(1,Math.round((a.check_seconds||300)/60))} min`;return a.trigger_type||''}
function automationDate(v){if(!v)return '—';try{return new Date(v).toLocaleString([], {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return v}}
function automationCard(a){const ag=automationAgent(a)||{id:a.agent_id,name:a.agent_id,avatar_color:'#64748b'},on=!!a.enabled,failed=a.last_status==='failed';return `<div class="automation-card ${on?'active':'paused'} ${failed?'failed':''}"><div class="automation-state-rail"></div><div>${pixelMonster(ag,'mini')}</div><div class="automation-main"><div class="automation-title"><strong>${esc(a.name||'Automação')}</strong><span class="automation-badge ${on?'on':'off'}">${on?'ATIVA':'PAUSADA'}</span><span class="automation-trigger-pill">${esc(automationTriggerLabel(a))}</span></div><div class="automation-meta">executada por ${esc(ag.name||a.agent_id)} · ${esc(ag.model||'modelo padrão')}</div><div class="automation-action-text">${esc(a.action||'')}</div>${a.condition?`<div class="automation-condition">SE ${esc(a.condition)}</div>`:''}<div class="automation-stats"><div class="automation-stat"><span>próxima execução</span><b>${esc(automationDate(a.next_run_at))}</b></div><div class="automation-stat"><span>última execução</span><b>${esc(automationDate(a.last_run_at))}</b></div><div class="automation-stat"><span>status</span><b class="${failed?'automation-error':a.last_status==='completed'?'automation-ok':''}">${esc((a.last_status||'never').toUpperCase())}</b></div><div class="automation-stat"><span>runs</span><b>${a.run_count||0}</b></div></div>${a.last_error?`<div class="run-error" style="margin-top:8px">${esc(a.last_error)}</div>`:''}</div><div class="automation-card-actions"><button class="mini" onclick="toggleAutomation('${a.id}',${on?'false':'true'})">${on?'Pausar':'Ativar'}</button><button class="mini danger" onclick="deleteAutomationUI('${a.id}')">Excluir</button></div></div>`}
function automationTriggerFields(type){if(type==='interval')return `<div class="field"><label>Frequência</label><input id="automationInterval" type="number" min="1" value="60"><small class="muted">minutos entre execuções</small></div>`;if(type==='daily')return `<div class="field"><label>Horário</label><input id="automationDaily" type="time" value="09:00"><small class="muted">todos os dias</small></div>`;if(type==='once'){const d=new Date(Date.now()+3600000);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return `<div class="field"><label>Data e hora</label><input id="automationOnce" type="datetime-local" value="${d.toISOString().slice(0,16)}"><small class="muted">executa uma vez e encerra</small></div>`}return `<div class="field" style="grid-column:1/-1"><label>Condição</label><textarea id="automationCondition" placeholder="Ex.: quando chegar um novo pedido da Cemari"></textarea></div><div class="field"><label>Verificar a cada</label><input id="automationCheck" type="number" min="1" value="5"><small class="muted">minutos</small></div>`}
function bindAutomationForm(){const trigger=document.querySelector('#automationTrigger'),extra=document.querySelector('#automationTriggerExtra'),create=document.querySelector('#createAutomation');if(trigger&&extra)trigger.onchange=()=>extra.innerHTML=automationTriggerFields(trigger.value);if(create)create.onclick=createAutomationUI;const general=document.querySelector('#automationOpenGeneral');if(general)general.onclick=()=>openAgent('general')}
async function renderAutomations(){stopWorld();currentView='automations';selected=null;title.textContent='Automações';try{const j=await api('/api/automations');automations=j.automations||[];const active=automations.filter(a=>a.enabled).length,paused=automations.length-active,failed=automations.filter(a=>a.last_status==='failed').length,next=automations.filter(a=>a.enabled&&a.next_run_at).sort((a,b)=>String(a.next_run_at).localeCompare(String(b.next_run_at)))[0];const general=agents.find(a=>a.id==='general')||{id:'general',name:'General',avatar_color:'#ef4444'};content.innerHTML=`<div class="automation-shell"><div class="automation-page-head"><div><h1>Automações</h1><p>Agentes executando tarefas no tempo certo ou quando uma condição for atendida.</p></div><div class="head-actions"><button id="automationOpenGeneral">Abrir General</button></div></div><div class="automation-summary"><div class="automation-summary-item"><span>Ativas</span><b class="ok">${active}</b></div><div class="automation-summary-item"><span>Pausadas</span><b>${paused}</b></div><div class="automation-summary-item"><span>Falhas recentes</span><b class="${failed?'bad':''}">${failed}</b></div><div class="automation-summary-item"><span>Próxima execução</span><b>${next?esc(automationDate(next.next_run_at)):'—'}</b></div></div><section class="automation-builder"><aside class="automation-builder-aside"><div class="automation-builder-kicker">01 · Programar</div><div class="automation-builder-agent">${pixelMonster(general,'mini')}<div><strong>General</strong><span>orquestrador de automações</span></div></div><h2>Crie uma rotina para qualquer agente.</h2><p>Defina quem executa, o que deve ser feito e qual evento dispara a execução.</p><div class="builder-note">Toda automação gera Runs independentes. Pausar uma automação não apaga o histórico.</div></aside><div class="automation-builder-main"><div class="automation-form-grid"><div class="field"><label>Nome da automação</label><input id="automationName" placeholder="Ex.: Resumo diário"></div><div class="field"><label>Agente executor</label><select id="automationAgent">${agents.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${esc(a.model||'')}</option>`).join('')}</select></div><div class="field automation-action"><label>Ação a executar</label><textarea id="automationAction" placeholder="Descreva exatamente o que o agente deve fazer quando a automação disparar..."></textarea></div><div class="automation-trigger-zone"><div class="automation-trigger-zone-head"><b>Quando executar</b><span>Escolha um gatilho temporal ou uma condição monitorada pelo sistema.</span></div><div class="automation-trigger-config"><div class="field"><label>Gatilho</label><select id="automationTrigger"><option value="interval">Intervalo recorrente</option><option value="daily">Horário diário</option><option value="once">Uma única vez</option><option value="condition">Quando condição ocorrer</option></select></div><div class="automation-trigger-extra" id="automationTriggerExtra">${automationTriggerFields('interval')}</div></div></div></div><div class="automation-builder-actions"><span class="hint">A automação começa ativa e pode ser pausada depois.</span><button class="primary" id="createAutomation">+ Criar automação</button></div></div></section><div class="automation-list-head"><h2>Rotinas configuradas</h2><span>${automations.length} total · ${active} ativa${active===1?'':'s'}</span></div><div class="automation-list">${automations.map(automationCard).join('')||`<div class="automation-empty"><div class="automation-empty-inner"><div class="automation-empty-icon">⌁</div><strong>Nenhuma automação ainda</strong><span>Crie a primeira rotina acima ou peça ao General para programar uma em linguagem natural.</span></div></div>`}</div></div>`;bindAutomationForm()}catch(e){content.innerHTML=`<div class="empty">Falha ao carregar automações: ${esc(e.message)}</div>`}}

async function createAutomationUI(){const agent_id=document.querySelector('#automationAgent')?.value||'',action=document.querySelector('#automationAction')?.value.trim()||'',name=document.querySelector('#automationName')?.value.trim()||'Automação',trigger_type=document.querySelector('#automationTrigger')?.value||'interval';if(!agent_id||!action){alert('Escolha o agente e descreva a ação.');return}const body={name,agent_id,action,trigger_type,enabled:true};if(trigger_type==='interval')body.interval_seconds=Math.max(60,Number(document.querySelector('#automationInterval')?.value||60)*60);if(trigger_type==='daily')body.daily_time=document.querySelector('#automationDaily')?.value||'09:00';if(trigger_type==='once'){const v=document.querySelector('#automationOnce')?.value;if(!v){alert('Escolha a data e hora.');return}body.once_at=new Date(v).toISOString()}if(trigger_type==='condition'){body.condition=document.querySelector('#automationCondition')?.value.trim()||'';body.check_seconds=Math.max(60,Number(document.querySelector('#automationCheck')?.value||5)*60);if(!body.condition){alert('Descreva a condição.');return}}try{await api('/api/automations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});await renderAutomations()}catch(e){alert(e.message)}}
async function toggleAutomation(id,enabled){try{await api('/api/automations/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled})});await renderAutomations()}catch(e){alert(e.message)}}
async function deleteAutomationUI(id){if(!confirm('Excluir esta automação?'))return;try{await api('/api/automations/'+encodeURIComponent(id),{method:'DELETE'});await renderAutomations()}catch(e){alert(e.message)}}

function renderCompanies(){stopWorld();currentView='companies';selected=null;title.textContent='Empresas';const unassigned=agents.filter(a=>!a.company_id);const body=companies.map(c=>{const companySectors=sectors.filter(s=>s.company_id===c.id),companyProjects=projects.filter(p=>p.company_id===c.id),companyAgents=agents.filter(a=>a.company_id===c.id),withoutSector=companyAgents.filter(a=>!a.sector_id);const projectRow=`<div class="org-world-projects"><span class="org-world-projects-label">PROJETOS</span>${companyProjects.map(p=>`<span class="org-world-project"><b>${esc(p.name)}</b><button class="mini context-btn" onclick="openContext('project','${p.id}')">Contexto</button></span>`).join('')||'<span class="muted" style="font-size:9px">nenhum projeto</span>'}</div>`;const sectorGroups=companySectors.map(s=>{const groupAgents=companyAgents.filter(a=>a.sector_id===s.id);return `<div class="org-world-sector org-dropzone" data-company="${esc(c.id)}" data-sector="${esc(s.id)}"><div class="org-world-sector-head"><strong>${esc(s.name)}</strong><span class="muted">${groupAgents.length}</span><div class="org-world-sector-actions"><button class="mini context-btn" onclick="openContext('sector','${s.id}')">Contexto</button><button class="mini" onclick="renameSector('${s.id}')">Renomear</button></div></div><div class="org-world-agents sector-agents">${groupAgents.map(companyAgentCard).join('')||'<span class="org-world-empty">vazio</span>'}</div></div>`}).join('');const noSectorGroup=`<div class="org-world-sector org-dropzone" data-company="${esc(c.id)}" data-sector=""><div class="org-world-sector-head"><strong>Sem setor</strong><span class="muted">${withoutSector.length}</span></div><div class="org-world-agents sector-agents">${withoutSector.map(companyAgentCard).join('')||'<span class="org-world-empty">vazio</span>'}</div></div>`;return `<section class="org-world-room company org-company-drop" data-company="${esc(c.id)}"><div class="org-world-room-head"><strong>${esc(c.name)}</strong><span class="org-world-count">${companyAgents.length} agente${companyAgents.length===1?'':'s'}</span><div class="org-world-room-actions"><button class="mini context-btn" onclick="openContext('company','${c.id}')">Contexto</button><button class="mini" onclick="newProject('${c.id}')">+ Projeto</button><button class="mini" onclick="renameCompany('${c.id}')">Renomear</button><button class="mini" onclick="newSector('${c.id}')">+ Setor</button></div></div>${projectRow}<div class="org-world-sector-grid">${sectorGroups}${noSectorGroup}</div></section>`}).join('');const global=`<section class="org-world-room org-unassigned org-dropzone" data-company="" data-sector=""><div class="org-world-room-head"><strong>SEM EMPRESA</strong><span class="org-world-count">${unassigned.length} agente${unassigned.length===1?'':'s'}</span><span class="org-company-hint" style="margin-left:auto">solte aqui para desalocar</span></div><div class="org-world-sector-grid"><div class="org-world-sector org-dropzone" data-company="" data-sector=""><div class="org-world-sector-head"><strong>Global / sem empresa</strong><span class="muted">${unassigned.length}</span></div><div class="org-world-agents sector-agents">${unassigned.map(companyAgentCard).join('')||'<span class="org-world-empty">vazio</span>'}</div></div></div></section>`;content.innerHTML=`<div class="companies-shell"><div class="companies-toolbar"><h1 class="section-title">Empresas</h1><span class="org-page-hint">mesma organização visual do World · arraste agentes entre setores</span><span class="spacer"></span><button class="primary" id="newCompanyBtn">+ Empresa</button></div><div class="org-world-board"><div class="org-world-rooms">${body}${global}</div></div></div>`;document.querySelector('#newCompanyBtn').onclick=newCompany;bindCompanyDrag()}
async function moveOrgAgent(id,company_id,sector_id){const a=agents.find(x=>x.id===id);if(!a)return;if((a.company_id||null)===(company_id||null)&&(a.sector_id||null)===(sector_id||null))return;const j=await api('/api/agents/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({company_id:company_id||null,sector_id:sector_id||null})});agents=agents.map(x=>x.id===id?j.agent:x);renderCompanies()}
function bindCompanyDrag(){document.querySelectorAll('[data-org-agent]').forEach(el=>{el.ondragstart=e=>{window.__orgDragging=true;el.classList.add('dragging');e.dataTransfer.setData('text/plain',el.dataset.orgAgent);e.dataTransfer.effectAllowed='move'};el.ondragend=()=>{el.classList.remove('dragging');document.querySelectorAll('.org-dropzone.dragover').forEach(z=>z.classList.remove('dragover'));setTimeout(()=>window.__orgDragging=false,40)}});document.querySelectorAll('.org-dropzone').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();e.stopPropagation();zone.classList.add('dragover');e.dataTransfer.dropEffect='move'};zone.ondragleave=e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('dragover')};zone.ondrop=async e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain');try{await moveOrgAgent(id,zone.dataset.company||null,zone.dataset.sector||null)}catch(err){alert(err.message)}}})}
async function newCompany(){const name=prompt('Nome da empresa:');if(!name?.trim())return;const j=await api('/api/companies',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});companies.push(j.company);renderCompanies()}
async function renameCompany(id){const c=companies.find(x=>x.id===id),name=prompt('Novo nome da empresa:',c?.name||'');if(!name?.trim())return;const j=await api('/api/companies/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name})});companies=companies.map(x=>x.id===id?j.company:x);renderCompanies()}
async function newSector(company_id){const name=prompt('Nome do setor:');if(!name?.trim())return;const j=await api('/api/sectors',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,company_id})});sectors.push(j.sector);renderCompanies()}
async function newProject(company_id){const name=prompt('Nome do projeto:');if(!name?.trim())return;const j=await api('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,company_id})});projects.push(j.project);renderCompanies()}
async function renameSector(id){const s=sectors.find(x=>x.id===id),name=prompt('Novo nome do setor:',s?.name||'');if(!name?.trim())return;const j=await api('/api/sectors/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name})});sectors=sectors.map(x=>x.id===id?j.sector:x);renderCompanies()}

function contextScopeLabel(scopeType,scopeId){if(scopeType==='company')return companies.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='sector')return sectors.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='agent')return agents.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='project')return projects.find(x=>x.id===scopeId)?.name||scopeId;return scopeId}
async function openContext(scopeType,scopeId){const label=contextScopeLabel(scopeType,scopeId);const j=await api('/api/context-items?scope_type='+encodeURIComponent(scopeType)+'&scope_id='+encodeURIComponent(scopeId));const items=j.items||[];document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal context-modal"><h2>Contexto · ${esc(label)}</h2><div class="context-summary">Este contexto é herdado automaticamente pelos agentes alocados neste escopo.</div><div class="context-list">${items.map(contextItemHtml).join('')||'<div class="context-empty">Nenhum contexto cadastrado neste escopo.</div>'}</div><div class="context-form-grid"><select id="ctxKind"><option value="knowledge">Conhecimento</option><option value="instruction">Instrução</option><option value="procedure">Procedimento</option><option value="fact">Fato</option><option value="state">Estado</option><option value="note">Nota</option><option value="reference">Referência</option></select><input id="ctxPriority" type="number" min="0" max="100" value="50" title="Prioridade"><input id="ctxTitle" placeholder="Título do contexto"><textarea id="ctxContent" placeholder="Conteúdo que os agentes deste escopo devem conhecer..."></textarea></div><label style="display:flex;align-items:center;gap:7px;font-size:10px;color:#7d899a;margin-top:8px"><input id="ctxPinned" type="checkbox" style="width:auto"> Sempre incluir no prompt (pinned)</label><div class="modal-actions"><button onclick="closeModal()">Fechar</button><button class="primary" id="ctxSave">+ Adicionar contexto</button></div></div></div>`;document.querySelector('#ctxSave').onclick=()=>saveContextItem(scopeType,scopeId)}
function contextItemHtml(item){return `<div class="context-item"><div><h4>${item.pinned?'📌 ':''}${esc(item.title)}</h4><p>${esc(item.content)}</p><div class="context-meta">${esc(item.kind)} · prioridade ${item.priority??50} · ${item.active===false?'inativo':'ativo'}</div></div><button class="mini danger" onclick="deleteContextItemUI('${item.id}','${item.scope_type}','${item.scope_id}')">Excluir</button></div>`}
async function saveContextItem(scopeType,scopeId){const title=document.querySelector('#ctxTitle')?.value.trim()||'',contentValue=document.querySelector('#ctxContent')?.value.trim()||'';if(!title||!contentValue){alert('Preencha título e conteúdo.');return}const body={scope_type:scopeType,scope_id:scopeId,kind:document.querySelector('#ctxKind').value,title,content:contentValue,priority:Number(document.querySelector('#ctxPriority').value||50),pinned:!!document.querySelector('#ctxPinned').checked};await api('/api/context-items',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});await openContext(scopeType,scopeId)}
async function deleteContextItemUI(id,scopeType,scopeId){if(!confirm('Excluir este contexto?'))return;await api('/api/context-items/'+encodeURIComponent(id),{method:'DELETE'});await openContext(scopeType,scopeId)}
async function openAgentProjects(agentId){const a=agents.find(x=>x.id===agentId);const j=await api('/api/agent-context-bindings?agent_id='+encodeURIComponent(agentId));const selectedIds=new Set((j.bindings||[]).filter(x=>x.scope_type==='project').map(x=>x.scope_id));const available=projects.filter(p=>!a?.company_id||p.company_id===a.company_id);document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>Projetos · ${esc(a?.name||agentId)}</h2><div class="context-summary">Projetos conectados entram como contexto adicional deste agente.</div><div class="chips" style="display:grid;gap:8px">${available.map(p=>`<label class="chip" style="justify-content:flex-start"><input type="checkbox" data-project-binding="${p.id}" ${selectedIds.has(p.id)?'checked':''}> ${esc(p.name)}</label>`).join('')||'<div class="context-empty">Nenhum projeto nesta empresa.</div>'}</div><div class="modal-actions"><button onclick="closeModal()">Cancelar</button><button class="primary" id="saveAgentProjects">Salvar projetos</button></div></div></div>`;document.querySelector('#saveAgentProjects').onclick=()=>saveAgentProjects(agentId)}
async function saveAgentProjects(agentId){const project_ids=[...document.querySelectorAll('[data-project-binding]:checked')].map(x=>x.dataset.projectBinding);await api('/api/agent-context-bindings/'+encodeURIComponent(agentId),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({project_ids})});closeModal()}
function modelTier(model){const m=model.toLowerCase();const frontier=['gpt-6','gpt-5.6-sol','gpt-5.6-terra','claude-opus-5','grok-4.6','grok-4.5','gemini-3.8-pro','gemini-3.7-pro','deepseek-v4-pro','deepseek-pro','kimi-k3','qwen3.8-max','qwen3.7-max','glm-5.3','glm-5'];if(frontier.some(x=>m.includes(x)))return 'frontier';const strong=['gpt-5.6-luna','gpt-5.5','gpt-5.4','claude-sonnet-5','claude-sonnet-4.5','gemini-3.8-flash','gemini-3.7-flash','deepseek-v4','deepseek-3.2','qwen3.8','qwen3.7','qwen3-coder','kimi-k2.7','kimi-k2.6','kimi-k2.5','minimax-m3','minimax-m2.5','muse-glimmer-30b','nemotron-3.5-lightning'];if(strong.some(x=>m.includes(x)))return 'strong';const weak=[':free','-small','small','7b','8b','1.8b','lite','mini','flash-lite','contributor'];if(weak.some(x=>m.includes(x)))return 'weak';return 'medium'}
function tierLabel(t){return {frontier:'Frontier',strong:'Fortes',medium:'Médios',weak:'Fracos'}[t]||t}
function modelStatus(model){return modelHealth[model]?.status||'unknown'}
function modelRoute(model){return String(model||'').split('/')[0]||'other'}
function routeLabel(route){const labels={cx:'Codex',cl:'OpenRouter',gh:'GitHub',gc:'Gemini CLI',kimi:'Kimi',kr:'Kiro',cbai:'CodeBuddy',kiro:'Kiro'};return labels[route]||route.toUpperCase()}
function modelFamily(model){const raw=String(model||''),parts=raw.split('/');if(parts.length>=3)return parts[1];const name=(parts[1]||parts[0]||'').toLowerCase();if(name.includes('gpt'))return 'openai';if(name.includes('claude'))return 'anthropic';if(name.includes('gemini'))return 'google';if(name.includes('kimi'))return 'moonshot';if(name.includes('glm'))return 'z-ai';if(name.includes('deepseek'))return 'deepseek';return routeLabel(modelRoute(raw)).toLowerCase()}
function modelStatusLabel(st){return {working:'FUNCIONANDO',failing:'FALHANDO',unknown:'NÃO OBSERVADO'}[st]||String(st).toUpperCase()}
function filteredModels(){const q=modelExplorer.search.trim().toLowerCase();return models.filter(m=>{const st=modelStatus(m),tier=modelTier(m),route=modelRoute(m);if(modelExplorer.status!=='all'&&st!==modelExplorer.status)return false;if(modelExplorer.tier!=='all'&&tier!==modelExplorer.tier)return false;if(modelExplorer.route!=='all'&&route!==modelExplorer.route)return false;if(q&&!String(m).toLowerCase().includes(q)&&!modelFamily(m).includes(q)&&!routeLabel(route).toLowerCase().includes(q))return false;return true})}
function modelSummaryCard(value,label,kind=''){return `<div class="model-summary-card ${kind}"><b>${value}</b><span>${esc(label)}</span></div>`}
function modelRow(model){const st=modelStatus(model),tier=modelTier(model),route=modelRoute(model);return `<div class="model-row ${st}"><div class="model-row-status"><span class="model-state-dot"></span></div><div class="model-row-main"><strong title="${esc(model)}">${esc(model)}</strong><span>${esc(modelFamily(model))}</span></div><div class="model-row-route">${esc(routeLabel(route))}</div><div class="model-row-tier tier-text-${tier}">${esc(tierLabel(tier))}</div><div class="model-row-state">${esc(modelStatusLabel(st))}</div><div class="model-row-actions"><button class="mini" data-copy-model="${esc(model)}">Copiar</button>${st==='working'?`<button class="mini" data-new-agent-model="${esc(model)}">Novo agente</button>`:''}</div></div>`}
function modelGroupSection(key,list){if(!list.length)return '';const label=modelExplorer.group==='route'?routeLabel(key):tierLabel(key);return `<section class="model-explorer-group"><div class="model-explorer-group-head"><strong>${esc(label)}</strong><span>${list.length} modelo${list.length===1?'':'s'}</span></div><div class="model-table"><div class="model-table-head"><span></span><span>Modelo</span><span>Rota</span><span>Capacidade</span><span>Status</span><span>Ações</span></div>${list.map(modelRow).join('')}</div></section>`}
function renderModelResults(){const list=filteredModels();let html='';if(modelExplorer.group==='route'){const routes=[...new Set(list.map(modelRoute))].sort((a,b)=>routeLabel(a).localeCompare(routeLabel(b)));html=routes.map(r=>modelGroupSection(r,list.filter(m=>modelRoute(m)===r))).join('')}else{html=['frontier','strong','medium','weak'].map(t=>modelGroupSection(t,list.filter(m=>modelTier(m)===t))).join('')}return html||'<div class="model-no-results">Nenhum modelo corresponde aos filtros atuais.</div>'}
function providerCard(p){const tested=providerTest?.results?.find(r=>r.connectionId===p.id),ok=tested?tested.valid:(p.test_status==='active'?true:p.test_status==='unavailable'?false:null),cls=ok===true?'ok':ok===false?'bad':'unknown',label=ok===true?'CONECTADO':ok===false?'FALHANDO':'NÃO TESTADO',latency=tested?.latencyMs,detail=tested?.error||p.last_error||'';return `<div class="provider-card ${cls}"><div class="provider-card-top"><span class="provider-state-dot"></span><strong title="${esc(p.name||p.provider||'Conexão')}">${esc(p.name||p.provider||'Conexão')}</strong></div><div class="provider-route">${esc(p.provider||'')}</div><div class="provider-card-bottom"><span>${label}</span>${latency!=null?`<b>${Math.round(latency)} ms</b>`:''}</div>${detail?`<small>${esc(detail)}</small>`:''}</div>`}
function bindModelExplorer(){const search=document.querySelector('#modelSearch'),status=document.querySelector('#modelStatus'),tier=document.querySelector('#modelTierFilter'),route=document.querySelector('#modelRouteFilter'),group=document.querySelector('#modelGroup');if(search)search.oninput=e=>{modelExplorer.search=e.target.value;renderModels(false,true)};if(status)status.onchange=e=>{modelExplorer.status=e.target.value;renderModels(false,true)};if(tier)tier.onchange=e=>{modelExplorer.tier=e.target.value;renderModels(false,true)};if(route)route.onchange=e=>{modelExplorer.route=e.target.value;renderModels(false,true)};if(group)group.onchange=e=>{modelExplorer.group=e.target.value;renderModels(false,true)};document.querySelectorAll('[data-model-tab]').forEach(b=>b.onclick=()=>{modelExplorer.status=b.dataset.modelTab;renderModels(false,true)});const toggle=document.querySelector('#toggleProviders');if(toggle)toggle.onclick=()=>{modelExplorer.providersOpen=!modelExplorer.providersOpen;renderModels(false,true)};const problems=document.querySelector('#providerProblemsOnly');if(problems)problems.onchange=e=>{modelExplorer.providerProblemsOnly=e.target.checked;renderModels(false,true)};document.querySelectorAll('[data-copy-model]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copyModel);const old=b.textContent;b.textContent='Copiado';setTimeout(()=>b.textContent=old,900)}catch(_){}});document.querySelectorAll('[data-new-agent-model]').forEach(b=>b.onclick=()=>newAgentModal(b.dataset.newAgentModel));const test=document.querySelector('#testProviders');if(test)test.onclick=testProviderConnections;const probe=document.querySelector('#probeModel');if(probe)probe.onclick=probeIndependentModel}
function renderModels(reset=false,preserveFocus=false){stopWorld();currentView='models';selected=null;title.textContent='Modelos';if(reset)modelExplorer={status:'working',search:'',tier:'all',route:'all',group:'tier',providersOpen:false,providerProblemsOnly:false};const focused=document.activeElement?.id,selStart=document.activeElement?.selectionStart??null;const counts={working:0,failing:0,unknown:0};models.forEach(m=>counts[modelStatus(m)]++);const connected=providerConnections.filter(p=>p.test_status==='active').length,failedProviders=providerConnections.filter(p=>p.test_status==='unavailable'||p.last_error).length;const routes=[...new Set(models.map(modelRoute))].sort((a,b)=>routeLabel(a).localeCompare(routeLabel(b)));let providerList=[...providerConnections].sort((a,b)=>{const bad=x=>(x.test_status==='unavailable'||x.last_error)?0:1;return bad(a)-bad(b)||String(a.provider||'').localeCompare(String(b.provider||''))});if(modelExplorer.providerProblemsOnly)providerList=providerList.filter(p=>p.test_status==='unavailable'||p.last_error);const totalFiltered=filteredModels().length;content.innerHTML=`<div class="models-page"><div class="models-header"><div><h1>Modelos</h1><p>Catálogo operacional do 9Router. Por padrão, apenas modelos observados funcionando são exibidos.</p></div><div class="head-actions"><button id="probeModel">Teste independente</button><button id="testProviders">Testar providers</button></div></div><div class="model-summary-grid">${modelSummaryCard(counts.working,'funcionando','ok')}${modelSummaryCard(counts.failing,'falhando','bad')}${modelSummaryCard(counts.unknown,'não observados','muted')}${modelSummaryCard(connected,'providers conectados','blue')}${modelSummaryCard(failedProviders,'providers com problema',failedProviders?'bad':'muted')}</div><section class="providers-section ${modelExplorer.providersOpen?'open':''}"><button class="providers-toggle" id="toggleProviders"><span><b>Infra / Providers</b><small>9Router · ${providerConnections.length} conexões</small></span><span class="providers-toggle-right">${failedProviders?`<em>${failedProviders} problema${failedProviders===1?'':'s'}</em>`:'sem alertas'} <i>${modelExplorer.providersOpen?'▾':'▸'}</i></span></button>${modelExplorer.providersOpen?`<div class="providers-body"><div class="providers-tools"><label><input type="checkbox" id="providerProblemsOnly" ${modelExplorer.providerProblemsOnly?'checked':''}> mostrar só com problema</label><span>Falhas aparecem primeiro. Latência vem do teste nativo do 9Router.</span></div><div class="provider-grid compact">${providerList.map(providerCard).join('')||'<div class="model-no-results">Nenhum provider neste filtro.</div>'}</div></div>`:''}</section><section class="model-explorer"><div class="model-explorer-top"><div><h2>Modelos disponíveis</h2><span>${totalFiltered} exibidos de ${models.length}</span></div><div class="model-view-controls"><label>Agrupar por <select id="modelGroup"><option value="tier" ${modelExplorer.group==='tier'?'selected':''}>capacidade</option><option value="route" ${modelExplorer.group==='route'?'selected':''}>rota/provider</option></select></label></div></div><div class="model-tabs"><button data-model-tab="working" class="${modelExplorer.status==='working'?'active':''}">Funcionando <b>${counts.working}</b></button><button data-model-tab="failing" class="${modelExplorer.status==='failing'?'active':''}">Falhando <b>${counts.failing}</b></button><button data-model-tab="unknown" class="${modelExplorer.status==='unknown'?'active':''}">Não observados <b>${counts.unknown}</b></button><button data-model-tab="all" class="${modelExplorer.status==='all'?'active':''}">Todos <b>${models.length}</b></button></div><div class="model-filterbar"><div class="model-search-wrap"><span>⌕</span><input id="modelSearch" value="${esc(modelExplorer.search)}" placeholder="Buscar modelo, família ou rota..."></div><select id="modelStatus" title="Status"><option value="working" ${modelExplorer.status==='working'?'selected':''}>Funcionando</option><option value="failing" ${modelExplorer.status==='failing'?'selected':''}>Falhando</option><option value="unknown" ${modelExplorer.status==='unknown'?'selected':''}>Não observados</option><option value="all" ${modelExplorer.status==='all'?'selected':''}>Todos</option></select><select id="modelTierFilter" title="Capacidade"><option value="all">Todas capacidades</option>${['frontier','strong','medium','weak'].map(t=>`<option value="${t}" ${modelExplorer.tier===t?'selected':''}>${tierLabel(t)}</option>`).join('')}</select><select id="modelRouteFilter" title="Rota/provider"><option value="all">Todas as rotas</option>${routes.map(r=>`<option value="${esc(r)}" ${modelExplorer.route===r?'selected':''}>${esc(routeLabel(r))} · ${esc(r)}</option>`).join('')}</select></div><div class="model-results">${renderModelResults()}</div></section></div>`;bindModelExplorer();if(preserveFocus&&focused){const el=document.querySelector('#'+CSS.escape(focused));if(el){el.focus();if(selStart!=null&&typeof el.setSelectionRange==='function')el.setSelectionRange(selStart,selStart)}}}

async function probeIndependentModel(){const b=document.querySelector('#probeModel');const m=models.find(x=>modelStatus(x)==='working')||models[0];const id=m?.model||m?.id||'';if(!id){alert('Nenhum modelo disponível.');return}if(b){b.disabled=true;b.textContent='Testando '+id+'…'}try{const j=await api('/api/model-probe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:id})});alert(j.ok?'Probe OK: '+j.model:'Resposta inesperada: '+j.text)}catch(e){alert('Probe falhou: '+e.message)}finally{if(b){b.disabled=false;b.textContent='Teste independente'}}}
async function testProviderConnections(){const b=document.querySelector('#testProviders');if(b){b.disabled=true;b.textContent='Testando no 9Router…'}try{providerTest=await api('/api/provider-connections/test',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});providerConnections=(await api('/api/provider-connections')).connections;renderModels()}catch(e){alert(e.message);renderModels()}}
document.querySelector('#newAgent').onclick=newAgentModal;document.querySelector('#refresh').onclick=()=>currentView==='world'?refreshWorld():currentView==='automations'?renderAutomations():currentView==='workflows'?renderWorkflows():currentView==='approvals'?renderApprovals():currentView==='events'?renderEvents():currentView==='runs'?renderRuns():currentView==='models'?renderModels():currentView==='tools'?renderTools():currentView==='companies'?renderCompanies():currentView==='about'?renderAbout():currentView==='objective'?renderObjective():selected?openAgent(selected.id):load();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{stopRunPolling();stopBrowserPanel();stopOpsTimer();document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='agents')renderAgents();if(b.dataset.view==='world')renderWorld();if(b.dataset.view==='automations')renderAutomations();if(b.dataset.view==='workflows')renderWorkflows();if(b.dataset.view==='approvals')renderApprovals();if(b.dataset.view==='events')renderEvents();if(b.dataset.view==='runs')renderRuns();if(b.dataset.view==='models')renderModels();if(b.dataset.view==='tools')renderTools();if(b.dataset.view==='companies')renderCompanies();if(b.dataset.view==='about')renderAbout();if(b.dataset.view==='objective')renderObjective()});
bindMonsterEyeTracking();
load();
</script></body></html>
