function workflowGuideHtml(w,errors){const nodes=w.nodes||[],edges=w.edges||[],startOk=nodes.filter(n=>n.type==='start').length===1,endOk=nodes.some(n=>n.type==='end'),agentOk=nodes.filter(n=>n.type==='agent').every(n=>n.agent_id),connectOk=!errors.some(e=>/saída|conex|alcançável|caminho|Start não pode|End não pode/i.test(e));const checks=[[startOk,'Início'],[endOk,'Fim'],[agentOk,'Agentes'],[connectOk,'Conexões']];return `<div class="wf3-guide"><div class="wf3-guide-head"><b>${errors.length?'Falta pouco para executar':'Workflow pronto'}</b><span>${errors.length?errors.length+' pendência'+(errors.length===1?'':'s'):'estrutura válida'}</span></div><div class="wf3-checks">${checks.map(([ok,label])=>`<div class="wf3-check ${ok?'ok':'bad'}">${ok?'✓':'○'} ${label}</div>`).join('')}</div>${errors.length?`<div class="wf3-errors">${errors.slice(0,4).map(x=>'• '+esc(x)).join('<br>')}${errors.length>4?`<br>+ ${errors.length-4} outra(s)`:''}</div>`:''}</div>`}
async function createWorkflowUI(kind='basic'){if(wfState.dirty&&!confirm('Descartar alterações não salvas?'))return;const t=workflowTemplate(kind);const j=await api('/api/workflows',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:`Workflow ${wfState.items.length+1}`,description:'',nodes:t.nodes,edges:t.edges})});wfState.current=j.workflow;wfState.selectedNode=t.nodes.find(n=>n.type==='agent')?.id||null;wfState.dirty=false;await loadWorkflows();renderWorkflows()}
async function saveWorkflowUI(){if(!wfState.current)return;wfState.current.name=document.querySelector('#wfName')?.value.trim()||wfState.current.name||'Workflow';wfState.current.description=document.querySelector('#wfDescription')?.value.trim()||'';const j=await api('/api/workflows/'+encodeURIComponent(wfState.current.id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(wfState.current)});wfState.current=j.workflow;wfState.dirty=false;wfState.validation=workflowLocalValidation();await loadWorkflows();renderWorkflows()}
async function deleteWorkflowUI(){if(!wfState.current||!confirm('Excluir este workflow?'))return;await api('/api/workflows/'+encodeURIComponent(wfState.current.id),{method:'DELETE'});wfState.current=null;wfState.selectedNode=null;wfState.dirty=false;await renderWorkflows()}
async function runWorkflowUI(){if(!wfState.current)return;const validation=workflowLocalValidation();if(validation.length){wfState.validation=validation;renderWorkflowEditor();return}if(wfState.dirty)await saveWorkflowUI();const btn=document.querySelector('#wfRunBtn'),input=wfState.runInput??document.querySelector('#wfRunInput')?.value??'';if(btn){btn.disabled=true;btn.textContent='Executando...'}try{await api('/api/workflows/'+encodeURIComponent(wfState.current.id)+'/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input})});await loadWorkflows();renderWorkflowEditor()}catch(e){await loadWorkflows();renderWorkflowEditor();alert(e.message)}finally{const b=document.querySelector('#wfRunBtn');if(b){b.disabled=false;b.textContent='▶ Executar teste'}}}
function renderWorkflowEditor(){const host=content.querySelector('.workflow-editor'),inspector=content.querySelector('.workflow-inspector');if(!host)return;if(!wfState.current){host.innerHTML='<div class="empty">Crie ou selecione um workflow.</div>';if(inspector)inspector.innerHTML='';return}const w=wfState.current,validation=workflowLocalValidation(),empty=!(w.nodes||[]).length;wfState.validation=validation;host.innerHTML=`<div class="wf3-toolbar"><input id="wfName" value="${esc(w.name)}" placeholder="Nome do workflow"><input id="wfDescription" value="${esc(w.description||'')}" placeholder="O que este fluxo faz?"><span id="wfDirty" class="wf3-save-state ${wfState.dirty?'dirty':''}">${wfState.dirty?'● não salvo':'✓ salvo'}</span><button class="primary" onclick="saveWorkflowUI()">Salvar</button></div><div class="wf3-canvas-wrap"><div class="workflow-canvas">${(w.nodes||[]).map(wfNodeHtml).join('')}${empty?`<div class="wf3-empty"><div class="wf3-empty-card"><h3>Monte seu primeiro fluxo</h3><p>Escolha um modelo para começar com a estrutura pronta. Depois basta trocar o agente, o prompt e as regras.</p><div class="wf3-empty-actions"><button class="primary" onclick="applyWorkflowTemplate('basic')">▶ Fluxo básico</button><button onclick="applyWorkflowTemplate('condition')">◇ Com decisão</button><button onclick="applyWorkflowTemplate('blank')">Começar mínimo</button></div></div></div>`:''}</div>${wfState.connectMode?`<div class="wf3-connect-banner">Conectando <b>${wfState.connectMode.toUpperCase()}</b> · clique no bloco de destino · <button onclick="wfState.connectMode=null;renderWorkflowEditor()">Cancelar</button></div>`:''}</div>${workflowGuideHtml(w,validation)}`;document.querySelector('#wfName').oninput=e=>{w.name=e.target.value;markWorkflowDirty()};document.querySelector('#wfDescription').oninput=e=>{w.description=e.target.value;markWorkflowDirty()};if(inspector)inspector.innerHTML=`<div class="wf3-section"><div class="wf-inspector-title">Adicionar etapa</div><div class="wf3-add-grid"><button onclick="addWorkflowNode('agent')">● Agente</button><button onclick="addWorkflowNode('condition')">◇ Condição</button><button onclick="addWorkflowNode('end')">■ Fim</button><button onclick="applyWorkflowTemplate('basic')">↺ Modelo básico</button></div></div>${workflowInspectorHtml()}<details class="wf-test-drawer wf3-section" ${wfState.testOpen?'open':''} ontoggle="wfState.testOpen=this.open"><summary>Testar e ver execuções</summary><div class="wf-test-body"><textarea id="wfRunInput" placeholder="Escreva aqui a entrada que o Start deve receber...">${esc(wfState.runInput||'')}</textarea><button id="wfRunBtn" class="primary wf3-run-btn" ${validation.length?'disabled':''} onclick="runWorkflowUI()">▶ Executar teste</button>${validation.length?'<small class="muted">Complete o checklist para liberar a execução.</small>':''}<div class="wf-inspector-title" style="margin-top:14px">Execuções recentes</div>${(wfState.runs||[]).slice(0,4).map(r=>`<div class="wf3-run-item ${esc(r.status)}"><b>${esc((r.status||'').toUpperCase())}</b><div>${esc((r.output||r.error||'').slice(0,120))}</div><small>${esc(r.started_at||'')}</small></div>`).join('')||'<div class="wf-inspector-empty">Ainda não há testes.</div>'}</div></details><div class="wf3-section"><button class="wf-danger" style="width:100%" onclick="deleteWorkflowUI()">Excluir workflow</button></div>`;const inp=document.querySelector('#wfRunInput');if(inp)inp.oninput=e=>wfState.runInput=e.target.value;bindWorkflowNodes();requestAnimationFrame(drawWorkflowEdges);updateWorkflowAssistantContext()}
async function selectWorkflow(id){if(wfState.dirty&&!confirm('Descartar alterações não salvas?'))return;wfState.current=wfState.items.find(x=>x.id===id)||null;wfState.selectedNode=null;wfState.connectMode=null;wfState.dirty=false;wfState.runInput='';await loadWorkflows();renderWorkflows()}
function workflowAssistantSnapshot(){const w=wfState.current;if(!w)return{workflow:null};const selected=w.nodes?.find(n=>n.id===wfState.selectedNode)||null;return{workflow:{id:w.id,name:w.name,description:w.description||'',nodes:(w.nodes||[]).map(n=>({id:n.id,type:n.type,label:n.label||'',agent_id:n.agent_id||null,prompt:n.prompt||'',condition:n.condition||''})),edges:(w.edges||[]).map(e=>({from:e.from,to:e.to,branch:e.branch||'next'}))},selected_node:selected?{id:selected.id,type:selected.type,label:selected.label||'',agent_id:selected.agent_id||null,prompt:selected.prompt||'',condition:selected.condition||''}:null,validation:workflowLocalValidation(w),available_agents:agents.map(a=>({id:a.id,name:a.name}))};}
function workflowAssistantContextText(){const snap=workflowAssistantSnapshot();return `SNAPSHOT ATUAL DO WORKFLOW (fonte de verdade):\n${JSON.stringify(snap,null,2)}`;}
function workflowAssistantHtml(){const a=agentWithSkill('actis.workflow-builder');const w=wfState.current,nodes=w?.nodes?.length||0,edges=w?.edges?.length||0,errors=w?workflowLocalValidation(w).length:0;const msgs=wfState.assistantMessages||[];return `<section class="wf-assistant"><aside class="wf-assistant-meta"><div class="wf-assistant-kicker">Assistente do Studio</div><h3>◇ Assistente de Workflow</h3><p>Ele acompanha o estado atual do canvas e pode explicar o fluxo, apontar erros e dizer exatamente o que fazer em seguida.</p><div class="wf-assistant-live"><i></i> CONTEXTO AO VIVO</div><div id="wfAssistantContext" class="wf-assistant-context">${w?`${nodes} etapas · ${edges} conexões · ${errors?errors+' pendência'+(errors===1?'':'s'):'workflow válido'}`:'nenhum workflow selecionado'}<br>modelo: ${esc(a?.model||'mesmo do General')}</div><div class="wf-assistant-hints"><button onclick="askWorkflowAssistant('O que este workflow faz atualmente?')">O que ele faz?</button><button onclick="askWorkflowAssistant('O que falta ou está errado neste workflow?')">O que falta?</button><button onclick="askWorkflowAssistant('Qual é o próximo passo recomendado neste workflow?')">Próximo passo</button></div></aside><div class="wf-assistant-main"><div id="wfAssistantMessages" class="wf-assistant-messages">${msgs.length?msgs.map(m=>`<div class="wf-assistant-msg ${esc(m.role)}">${esc(m.content)}</div>`).join(''):'<div class="wf-assistant-empty">Pergunte qualquer coisa sobre o workflow atual. Ex.: “como faço esse agente decidir entre dois caminhos?”</div>'}${wfState.assistantPending?'<div class="wf-assistant-msg assistant pending">Analisando o workflow atual...</div>':''}</div><div class="wf-assistant-compose"><textarea id="wfAssistantInput" placeholder="Pergunte sobre o workflow atual... (Enter envia · Shift+Enter quebra linha)"></textarea><button id="wfAssistantSend" class="primary" ${wfState.assistantPending||!w?'disabled':''} onclick="sendWorkflowAssistant()">${wfState.assistantPending?'...':'Enviar'}</button></div></div></section>`;}
function updateWorkflowAssistantContext(){const el=document.querySelector('#wfAssistantContext');if(!el)return;const w=wfState.current;if(!w){el.innerHTML='nenhum workflow selecionado';return}const errors=workflowLocalValidation(w).length;const a=agentWithSkill('actis.workflow-builder');el.innerHTML=`${(w.nodes||[]).length} etapas · ${(w.edges||[]).length} conexões · ${errors?errors+' pendência'+(errors===1?'':'s'):'workflow válido'}<br>modelo: ${esc(a?.model||'mesmo do General')}`;}
function bindWorkflowAssistant(){const inp=document.querySelector('#wfAssistantInput');if(!inp)return;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendWorkflowAssistant()}};const box=document.querySelector('#wfAssistantMessages');if(box)box.scrollTop=box.scrollHeight;}
async function askWorkflowAssistant(text){const inp=document.querySelector('#wfAssistantInput');if(inp){inp.value=text;inp.focus()}await sendWorkflowAssistant(text);}
async function sendWorkflowAssistant(forcedText=''){if(wfState.assistantPending||!wfState.current)return;const inp=document.querySelector('#wfAssistantInput'),question=String(forcedText||inp?.value||'').trim();if(!question)return;wfState.assistantMessages.push({role:'user',content:question});wfState.assistantPending=true;const panel=document.querySelector('.wf-assistant');if(panel){panel.outerHTML=workflowAssistantHtml();bindWorkflowAssistant()}try{const prior=wfState.assistantMessages.slice(0,-1).slice(-10).map(m=>({role:m.role,content:m.content}));const prompt=`${workflowAssistantContextText()}\n\nPERGUNTA DO USUÁRIO:\n${question}`;const history=[...prior,{role:'user',content:prompt}];const currentId=wfState.current?.id||null;const workflowAgent=agentWithSkill('actis.workflow-builder');if(!workflowAgent)throw new Error('Nenhum agente com skill actis.workflow-builder configurado.');const j=await api('/api/agents/'+encodeURIComponent(workflowAgent.id)+'/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({history,source:'user'})});wfState.assistantMessages.push({role:'assistant',content:j.text||'Sem resposta.'});const fresh=(await api('/api/workflows')).workflows||[];wfState.items=fresh;if(currentId){const updated=fresh.find(x=>x.id===currentId);if(updated){wfState.current=updated;wfState.dirty=false;wfState.validation=workflowLocalValidation(updated);wfState.runs=(await api('/api/workflows/'+encodeURIComponent(currentId)+'/runs')).runs||[]}}renderWorkflows()}catch(e){wfState.assistantMessages.push({role:'assistant',content:'Erro ao consultar o assistente: '+e.message})}finally{wfState.assistantPending=false;const current=document.querySelector('.wf-assistant');if(current){current.outerHTML=workflowAssistantHtml();bindWorkflowAssistant()}}}
async function renderWorkflows(){stopWorld();stopOpsTimer();currentView='workflows';selected=null;title.textContent='Workflows';await loadWorkflows();if(!wfState.current&&wfState.items.length){wfState.current=wfState.items[0];wfState.dirty=false;await loadWorkflows()}content.innerHTML=`<div class="wf3-page"><div class="wf3-head"><div><h1>Workflow Studio</h1><p>Construa uma sequência: início → agentes → decisões → fim. Clique nos blocos para configurar.</p></div><span class="wf3-count">${wfState.items.length} workflow${wfState.items.length===1?'':'s'}</span><button class="primary" onclick="createWorkflowUI('basic')">+ Novo workflow</button></div><div class="workflow-shell"><aside class="workflow-list"><div class="wf3-side-title"><span>Seus workflows</span></div><div class="wf3-template-stack"><button class="wf3-template" onclick="createWorkflowUI('basic')"><b>▶ Novo fluxo básico</b><small>Start → Agente → End</small></button><button class="wf3-template" onclick="createWorkflowUI('condition')"><b>◇ Novo com decisão</b><small>Start → Agente → Condição → End</small></button></div><div class="wf3-side-title"><span>Salvos</span><span>${wfState.items.length}</span></div>${wfState.items.map(w=>`<button class="wf-list-card ${wfState.current?.id===w.id?'active':''}" onclick="selectWorkflow('${w.id}')"><b>${esc(w.name)}</b><small>${(w.nodes||[]).length} etapas · ${(w.edges||[]).length} conexões</small></button>`).join('')||'<div class="empty">Nenhum workflow salvo.</div>'}</aside><main class="workflow-editor"></main><aside class="workflow-inspector"></aside></div><details class="wf-assistant-drawer" ${wfState.assistantOpen?'open':''} ontoggle="wfState.assistantOpen=this.open"><summary><strong>◇ Assistente de Workflow</strong><span>Pergunte sobre o fluxo e os próximos passos</span></summary>${workflowAssistantHtml()}</details></div>`;renderWorkflowEditor();bindWorkflowAssistant();updateWorkflowAssistantContext()}

let aboutMode='guide';
function aboutTabs(active=aboutMode){return `<div class="about-switch-wrap"><div class="about-switch" role="tablist" aria-label="Seções de Sobre"><button class="${active==='guide'?'active':''}" role="tab" aria-selected="${active==='guide'}" onclick="setAboutMode('guide')">Como usar</button><button class="${active==='technical'?'active':''}" role="tab" aria-selected="${active==='technical'}" onclick="setAboutMode('technical')">Técnico</button></div></div>`}
function setAboutMode(mode){aboutMode=mode==='technical'?'technical':'guide';content.scrollTop=0;renderAbout()}
function openGuideView(view){document.querySelector(`.nav button[data-view="${view}"]`)?.click()}
function renderAbout(){return aboutMode==='technical'?renderAboutTechnical():renderAboutGuide()}
function renderAboutGuide(){
stopWorld();stopOpsTimer();currentView='about';selected=null;history=[];title.textContent='Sobre';
const configuredAgents=agents.length,configuredCompanies=companies.length,configuredTools=toolCatalog.length;
content.innerHTML=aboutTabs('guide')+`<div class="about-guide"><section class="guide-hero"><div class="guide-kicker">ACTIS GEN · guia de uso</div><h1>Crie uma equipe de agentes e diga como ela deve trabalhar.</h1><p>Você não precisa começar pela parte técnica. No ACTIS, o caminho mais simples é: criar um agente, dar uma função a ele, colocar as ferramentas certas e depois organizar o trabalho em empresas, setores, workflows ou automações.</p><div class="guide-actions"><button class="primary" onclick="newAgentModal()">+ Criar meu primeiro agente</button><button onclick="openGuideView('agents')">Ver agentes</button><button onclick="openGuideView('world')">Abrir World</button></div><div class="guide-mini-stats"><span class="guide-pill"><b>${configuredAgents}</b> agentes agora</span><span class="guide-pill"><b>${configuredCompanies}</b> empresas</span><span class="guide-pill"><b>${configuredTools}</b> ferramentas disponíveis</span></div></section>
<section class="guide-quickstart"><div class="guide-step"><div class="guide-step-num">PASSO 01</div><b>Crie o agente</b><p>Dê um nome, uma função e instruções claras. Pense nele como uma pessoa nova entrando na equipe.</p></div><div class="guide-step"><div class="guide-step-num">PASSO 02</div><b>Dê capacidades</b><p>Escolha modelo, tools e permissões. Um agente só deve receber aquilo que realmente precisa usar.</p></div><div class="guide-step"><div class="guide-step-num">PASSO 03</div><b>Organize o contexto</b><p>Coloque o agente em uma empresa, setor ou projeto para ele herdar o contexto certo daquele trabalho.</p></div><div class="guide-step"><div class="guide-step-num">PASSO 04</div><b>Automatize depois</b><p>Quando a tarefa estiver funcionando bem no chat, transforme o processo em workflow ou automação.</p></div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Que tipo de agente posso criar?</h2><p>Agentes não têm um tipo rígido. A função nasce da combinação de instruções + modelo + tools + contexto. Estes são bons pontos de partida.</p></div><button class="guide-link" onclick="openGuideView('agents')">Ir para Agentes →</button></div><div class="guide-grid"><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">✦</span><b>Atendimento</b></div><p>Conversa com clientes, responde dúvidas, coleta informações e encaminha pedidos.</p><small>Exemplo: agente comercial que atende WhatsApp e registra o que falta para fechar um orçamento.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">⌁</span><b>Browser / WhatsApp</b></div><p>Navega em sites e sistemas web usando um harness de browser, com leitura e interação quando permitido.</p><small>Exemplo: acompanhar contatos selecionados, consultar mensagens e atualizar um CRM.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">▣</span><b>Operador de computador</b></div><p>Usa ferramentas de desktop, arquivos ou terminal para trabalhar diretamente em uma máquina autorizada.</p><small>Exemplo: organizar arquivos, abrir aplicativos ou executar tarefas repetitivas no computador.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">◇</span><b>Especialista</b></div><p>Recebe contexto e regras de um domínio específico e vira a referência daquela função.</p><small>Exemplo: orçamentista, analista financeiro, PCP, compras ou suporte técnico.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">⌘</span><b>General / Orquestrador</b></div><p>Coordena o próprio ACTIS, consulta estruturas, cria tarefas e pode delegar trabalho para outros agentes.</p><small>Use quando quiser controlar a equipe por linguagem natural em vez de configurar tudo manualmente.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">↗</span><b>Analista</b></div><p>Lê dados, histórico, conversas ou documentos e transforma isso em resumo, decisão ou próxima ação.</p><small>Exemplo: revisar Runs, identificar gargalos e preparar uma recomendação para outro agente executar.</small></div></div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Empresas, setores e projetos</h2><p>Use essa estrutura como pastas de contexto. O agente continua sendo o mesmo, mas entende melhor onde está trabalhando e quais informações devem acompanhá-lo.</p></div><button class="guide-link" onclick="openGuideView('companies')">Abrir Empresas →</button></div><div class="guide-flow"><div class="guide-flow-node"><span>Empresa</span><b>Contexto mais amplo</b><p>Regras, identidade, processos e informações compartilhadas pela organização.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>Setor</span><b>Contexto da equipe</b><p>Comercial, Financeiro, Operações, Suporte ou qualquer divisão que faça sentido.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>Projeto</span><b>Contexto temporário</b><p>Cliente, campanha, implantação ou iniciativa específica com informação própria.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>Agente</span><b>Função individual</b><p>Instruções, memória, ferramentas, modelo e responsabilidades daquele trabalhador digital.</p></div></div><div class="guide-note"><b>Dica:</b> na tela Empresas você pode arrastar um agente entre setores. Ao mover, você muda a alocação organizacional sem precisar recriar o agente.</div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Chat, Run e World não são a mesma coisa</h2><p>Separar esses conceitos ajuda a entender o que está acontecendo quando um agente trabalha.</p></div></div><div class="guide-grid"><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">●</span><b>Chat</b></div><p>É a conversa persistente com o agente. Você pode voltar depois e continuar de onde parou.</p><small>Uma conversa pode gerar várias execuções ao longo do tempo.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">▶</span><b>Run</b></div><p>É uma execução específica: você pediu algo, o agente começou, usou ferramentas e terminou ou falhou.</p><small>Use Execuções para acompanhar tarefas ativas, logs, erros e histórico.</small></div><div class="guide-card"><div class="guide-card-top"><span class="guide-card-icon">◎</span><b>World</b></div><p>É a visão operacional de vários agentes. Serve para observar quem está trabalhando e falar com diferentes agentes.</p><small>Bom para coordenação multiagente e visão geral da equipe.</small></div></div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Workflow ou automação?</h2><p>Os dois reduzem trabalho manual, mas resolvem problemas diferentes.</p></div></div><div class="guide-vs"><div class="guide-vs-card"><span class="guide-tag">Workflow</span><h3>Quando existe uma sequência</h3><p>Use quando uma tarefa precisa passar por etapas: um agente faz algo, outro continua, uma condição decide o caminho e o fluxo termina.</p><div class="guide-note">Exemplo: receber pedido → analisar dados → se faltar informação pedir complemento → gerar orçamento → revisar.</div><div class="guide-actions"><button onclick="openGuideView('workflows')">Abrir Workflows</button></div></div><div class="guide-vs-card"><span class="guide-tag">Automação</span><h3>Quando existe um gatilho</h3><p>Use quando um agente deve agir sozinho em um horário, intervalo ou condição específica.</p><div class="guide-note">Exemplo: todo dia às 8h revisar mensagens pendentes ou verificar a cada 5 minutos se chegou um novo pedido.</div><div class="guide-actions"><button onclick="openGuideView('automations')">Abrir Automações</button></div></div></div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Tools, harnesses e modelos</h2><p>Você pode pensar nesses três itens como capacidade, braço e cérebro do agente.</p></div></div><div class="guide-two"><div class="guide-concept"><div class="guide-concept-label">Capacidades</div><h3>Tools e harnesses</h3><p>Tools dizem o que o agente pode fazer. Harnesses conectam o ACTIS ao software real onde a ação acontece.</p><ul><li>Browser para sites e web apps</li><li>Computer para interface gráfica</li><li>Files para ler ou escrever arquivos</li><li>Terminal para comandos autorizados</li><li>Conectores para serviços e sistemas externos</li></ul><div class="guide-actions"><button onclick="openGuideView('tools')">Ver ferramentas</button><button onclick="openGuideView('connectors')">Ver Config</button></div></div><div class="guide-concept"><div class="guide-concept-label">Raciocínio</div><h3>Modelos</h3><p>O modelo é o cérebro usado em cada execução. Você pode escolher modelos diferentes conforme custo, velocidade e dificuldade do trabalho.</p><ul><li>tarefas simples: modelo rápido e barato</li><li>análise difícil: modelo mais forte</li><li>agente especializado: modelo compatível com as tools necessárias</li><li>saúde e disponibilidade ficam visíveis em Modelos</li></ul><div class="guide-actions"><button onclick="openGuideView('models')">Abrir Modelos</button></div></div></div></section>
<section class="guide-section"><div class="guide-section-head"><div><h2>Um jeito simples de começar</h2><p>Evite automatizar um processo ainda mal definido. Faça primeiro funcionar manualmente e só depois aumente a autonomia.</p></div></div><div class="guide-flow"><div class="guide-flow-node"><span>1</span><b>Crie 1 agente</b><p>Escolha uma função concreta, não “fazer tudo”.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>2</span><b>Teste no chat</b><p>Veja se instruções, modelo e tools são suficientes.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>3</span><b>Dê contexto</b><p>Empresa, setor, projeto e informações persistentes.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>4</span><b>Conecte agentes</b><p>Delegação ou workflow quando mais de uma função participar.</p></div><div class="guide-flow-arrow">→</div><div class="guide-flow-node"><span>5</span><b>Automatize</b><p>Quando o processo já estiver previsível e observável.</p></div></div><div class="guide-actions"><button class="primary" onclick="newAgentModal()">+ Novo agente</button><button onclick="openGuideView('companies')">Organizar equipe</button><button onclick="openGuideView('runs')">Ver execuções</button></div></section></div>`}

function renderAboutTechnical(){
stopWorld();stopOpsTimer();currentView='about';selected=null;history=[];title.textContent='Sobre';
const toolRows=toolCatalog.map(t=>`<tr><td><b>${esc(t.name)}</b><br><code>${esc(t.id)}</code></td><td>${esc(t.kind||'tool')}</td><td>${esc(t.description||'')}</td><td>${(t.scopes||[]).map(x=>`<span class="docs-badge">${esc(x)}</span>`).join(' ')}</td></tr>`).join('');
content.innerHTML=aboutTabs('technical')+`<div class="docs"><div class="docs-hero"><div class="docs-eyebrow">ACTIS GEN · estado auditado do working tree</div><h1>Control plane local para agentes de IA</h1><p>Infraestrutura comum para criar e operar agentes com modelo, contexto, memória, tools, scopes, automações e workflows sem construir um harness novo para cada domínio.</p><div class="docs-stats"><div class="docs-stat"><b>${agents.length}</b><span>Agentes</span></div><div class="docs-stat"><b>${models.length}</b><span>Modelos</span></div><div class="docs-stat"><b>${toolCatalog.length}</b><span>Tools</span></div><div class="docs-stat"><b>${companies.length}</b><span>Empresas</span></div></div></div>
<div class="docs-layout"><nav class="docs-toc"><strong>Documentação</strong><a href="#doc-visao">01 · Visão</a><a href="#doc-arquitetura">02 · Arquitetura</a><a href="#doc-agentes">03 · Agentes e conversas</a><a href="#doc-contexto">04 · Contexto e memória</a><a href="#doc-tools">05 · Tools e segurança</a><a href="#doc-autonomia">06 · Automações</a><a href="#doc-workflows">07 · Workflows</a><a href="#doc-observabilidade">08 · Runs e eventos</a><a href="#doc-modelos">09 · 9Router</a><a href="#doc-dados">10 · Persistência</a><a href="#doc-interface">11 · Interface</a><a href="#doc-api">12 · API</a><a href="#doc-operacao">13 · Operação</a><a href="#doc-validacao">14 · Validação</a><a href="#doc-limites">15 · Limites reais</a></nav><main>
<section class="docs-section" id="doc-visao"><h2>01 · Visão</h2><p><b>ACTIS GEN</b> generaliza infraestrutura e especializa agente, conhecimento, estado, contexto, permissões e tools. MAF executa o agente; 9Router resolve provider/modelo; MCPs operam software e sistema.</p><div class="docs-code">generalizar infraestrutura\nespecializar agente + conhecimento + estado + contexto + permissions + tools</div><div class="docs-note"><b>Estado desta página:</b> descreve o working tree auditado em 2026-09-15, não apenas o último commit.</div></section>
<section class="docs-section" id="doc-arquitetura"><h2>02 · Arquitetura</h2><div class="docs-code">Conversation / World / Direct Chat / Automation / Workflow / Delegation\n                               ↓\n                         execute_agent()\n                               ↓\n          contexto + memória + scopes + tools + timeout\n                               ↓\n                     Harness Core → MAF\n                               ↓\n                           9Router\n                               ↓\n                      provider / modelo\n                               ↘\n             Browser / Files / Terminal / Computer</div><p><code>execution_service.py</code> é o kernel canônico. Chat, automação, workflow e delegação não possuem engines paralelas.</p><p>O chat direto/global usa exclusão por agente: o mesmo agente não recebe duas requisições simultâneas nesse caminho, mas agentes diferentes podem trabalhar em paralelo. Computer Use aceita somente uma Run ativa por vez.</p></section>
<section class="docs-section" id="doc-agentes"><h2>03 · Agentes e conversas</h2><p>Agentes persistem identidade, aparência, empresa/setor, modelo, instruções, tools, <code>permissions</code>, memória, status e timestamps.</p><p><b>Conversation ≠ Run.</b> Conversas persistem mensagens; cada envio cria uma Run vinculada. Até 16 mensagens anteriores válidas entram no contexto da próxima execução.</p><p>O <code>general</code> recebe ACTIS Admin e pode administrar agentes, modelos, Runs, automações e delegações com tools <code>actis_*</code>.</p></section>
<section class="docs-section" id="doc-contexto"><h2>04 · Contexto e memória</h2><h3>Contexto hierárquico</h3><div class="docs-code">empresa → setor → projeto → agente</div><p>Projetos são ligados ao agente por bindings. Contextos têm kind, prioridade, pinned e estado ativo. Pinned entra sempre; os demais usam relevância lexical + prioridade.</p><h3>Memória persistente</h3><p>Quando <code>memory=true</code>, Runs concluídas gravam memória cross-conversation em SQLite. Retrieval usa FTS5 e fallback por recência; até 6 memórias podem ser injetadas por Run. Ainda não há embeddings/vetores.</p></section>
<section class="docs-section" id="doc-tools"><h2>05 · Tools, scopes e segurança</h2><p>Tools são capabilities; scopes controlam operações. A configuração permanente do agente pode escolher scopes individualmente e approvals aprovados adicionam scopes dinamicamente.</p><table class="docs-table"><tr><th>Tool</th><th>Tipo</th><th>Descrição</th><th>Scopes</th></tr>${toolRows}</table><div class="docs-code">browser.read / browser.interact\nfiles.read / files.write\nterminal.exec\ncomputer.view / computer.control\nactis.admin</div><p>Browser, Files e Computer filtram as operações MCP reais. Ex.: <code>files.read</code> não expõe escrita; <code>computer.view</code> não expõe clique/digitação.</p><h3>Approvals</h3><p>Capacidade ausente pode ser solicitada com <code>ACTIS_APPROVAL_REQUEST: scope</code>. A aba Approvals permite aprovar, negar e revogar.</p></section>
<section class="docs-section" id="doc-autonomia"><h2>06 · Automações</h2><p>Triggers: <code>interval</code>, <code>daily</code>, <code>once</code> e <code>condition</code>. O scheduler executa diretamente <code>execute_agent()</code>; conditions são avaliadas pelo General com <code>ACTIS_TRIGGER</code>/<code>ACTIS_WAIT</code>.</p><p>O scheduler é processo independente e, neste computador, está ativo como <code>actis-gen-scheduler.service</code>. Reiniciar o web não encerra o scheduler.</p></section>
<section class="docs-section" id="doc-workflows"><h2>07 · Workflows</h2><p>Workflows já são <b>executáveis</b>. A UI possui editor, inspector, validação, execução e histórico.</p><div class="docs-code">Start → Agent → Condition(true/false) → Agent → End</div><p>Agent nodes usam <code>execute_agent()</code>. Conditions aceitam <code>contains:</code>, <code>not contains:</code>, <code>equals:</code> ou substring. Prompts aceitam <code>{{input}}</code>, <code>{{previous}}</code> e <code>{{node.label}}</code>. Há limite de 50 etapas contra loops.</p><p>Workflow Runs persistem input, output, erro e trace por nó em <code>workflow_runs</code>.</p></section>
<section class="docs-section" id="doc-observabilidade"><h2>08 · Runs e eventos</h2><div class="docs-code">run.started → [run.heartbeat]* → run.completed | run.failed | run.cancelled</div><p>Runs podem ser canceladas. Computer Use publica heartbeat a cada 10 s e recebe deadline mínimo de 300 s. O Event Bus é persistente em SQLite e a aba Eventos atualiza aproximadamente a cada 2 s.</p></section>
<section class="docs-section" id="doc-modelos"><h2>09 · Modelos e 9Router</h2><p>9Router continua responsável por provider auth, catálogo, routing e fallback. O ACTIS GEN escolhe o ID configurado no agente e não implementa fallback próprio.</p><ul><li><b>Model probe:</b> completion real sem depender da sessão administrativa do dashboard.</li><li><b>Provider diagnostics:</b> detalhes administrativos que podem depender da sessão do 9Router.</li></ul></section>
<section class="docs-section" id="doc-dados"><h2>10 · Persistência</h2><p>Fonte canônica: <code>~/.local/share/actis-gen/actis.db</code>, SQLite WAL.</p><div class="docs-code">collections → agents / runs / companies / sectors / conversations / automations / context / projects / bindings\nevents\nmemories + memories_fts\napprovals\nworkflows\nworkflow_runs</div><p>JSON/JSONL antigos são legado de migração e só são importados quando a collection correspondente ainda está vazia.</p></section>
<section class="docs-section" id="doc-interface"><h2>11 · Interface</h2><table class="docs-table"><tr><th>Aba</th><th>Estado atual</th></tr><tr><td>Agentes</td><td>Cadastro, configuração, conversas e chat.</td></tr><tr><td>World</td><td>Organização operacional, atividade e chat global.</td></tr><tr><td>Automações</td><td>Builder e gestão de rotinas.</td></tr><tr><td>Workflows</td><td>Editor, validação, execução e histórico.</td></tr><tr><td>Approvals</td><td>Aprovar, negar e revogar scopes.</td></tr><tr><td>Eventos</td><td>Telemetria live do Event Bus.</td></tr><tr><td>Runs</td><td>Ativas, histórico, logs e cancelamento.</td></tr><tr><td>Modelos</td><td>Catálogo, saúde, probe e providers.</td></tr><tr><td>Tools</td><td>Capabilities/scopes.</td></tr><tr><td>Empresas</td><td>Empresas, setores, projetos, contexto e drag/drop.</td></tr></table></section>
<section class="docs-section" id="doc-api"><h2>12 · API local</h2><p>A API cobre agentes, organizações, projects/context/bindings, conversations, automations, approvals, workflows e workflow runs, memory, Runs, Events, storage, models e providers.</p><p>Base padrão: <code>http://127.0.0.1:8765</code>. Não há autenticação/RBAC nesta versão.</p><div class="docs-note">Documentação detalhada no projeto: <code>docs/API.md</code>.</div></section>
<section class="docs-section" id="doc-operacao"><h2>13 · Operação local</h2><div class="docs-code">ACTIS web   127.0.0.1:8765\n9Router     127.0.0.1:20128\nBrowser CDP  dinâmico por agente (9222–9822)\nScheduler   systemd --user active</div><p>Comandos: <code>actis-gen</code>, <code>actis-gen-web</code>, <code>actis-gen-scheduler</code> e <code>actis-gen-smoke</code>.</p><p>Branch auditado: <code>feat/runtime-foundation</code>, com várias mudanças ainda não commitadas.</p></section>
<section class="docs-section" id="doc-validacao"><h2>14 · Validação real</h2><div class="docs-code">pytest -q → 48 passed\nruff check src/meuharness tests → OK</div><p>O código ACTIS está com lint limpo no escopo <code>src/meuharness + tests</code>.</p><div class="docs-note docs-warn"><b>Correção documental:</b> a afirmação antiga “Ruff OK” estava desatualizada. <code>ruff check .</code> também não deve ser usado como métrica do ACTIS porque varre o clone upstream com configuração própria.</div></section>
<section class="docs-section" id="doc-limites"><h2>15 · Limites reais</h2><ul><li>Sistema local single-user, sem auth/RBAC/tenancy.</li><li>Memória sem embeddings/vetores.</li><li>Workflow engine é sequencial; não há fan-out/fan-in/paralelismo nativo.</li><li>Conditions de workflow são simples, não um expression engine completo.</li><li>Instalação systemd do scheduler é específica desta máquina.</li><li>Muitas entidades ainda usam JSON payload em <code>collections</code>.</li><li>A API local não deve ser exposta publicamente no estado atual.</li><li>Working tree ainda precisa de consolidação Git e dos 4 findings de lint.</li></ul></section>
</main></div></div>`}


function renderObjective(){
stopWorld();stopOpsTimer();currentView='objective';selected=null;history=[];title.textContent='Objetivo';
content.innerHTML=`<div class="docs"><div class="docs-hero"><div class="docs-eyebrow">ACTIS GEN · direção do produto</div><h1>Construir um sistema operacional para agentes</h1><p>O objetivo do ACTIS GEN é transformar agentes de IA em unidades operacionais persistentes, organizáveis e reutilizáveis: cada agente recebe identidade, modelo, contexto, memória, permissões, ferramentas e responsabilidades, enquanto o ACTIS coordena tudo em um único control plane.</p></div>
<div class="docs-layout"><nav class="docs-toc"><strong>Objetivos</strong><a href="#obj-norte">01 · Norte</a><a href="#obj-produto">02 · Produto final</a><a href="#obj-agentes">03 · Agentes</a><a href="#obj-orquestracao">04 · Orquestração</a><a href="#obj-integracoes">05 · Integrações</a><a href="#obj-autonomia">06 · Autonomia</a><a href="#obj-confiabilidade">07 · Confiabilidade</a><a href="#obj-metas">08 · Metas</a></nav><main>
<section class="docs-section" id="obj-norte"><h2>01 · Norte</h2><div class="docs-note"><b>Princípio central:</b> generalizar infraestrutura; especializar conhecimento, estado, ferramentas e regras de negócio.</div><p>Não queremos criar um harness novo para cada problema. Queremos que o ACTIS GEN consiga criar/configurar agentes e conectá-los a harnesses, MCPs, softwares e fontes de contexto já existentes.</p><div class="docs-code">SOFTWARE / DOMÍNIO\n        ↓\n    ACTIS GEN\n        ↓\n agentes + contexto + memória + permissões\n        ↓\n harnesses / MCPs / APIs / software real</div></section>
<section class="docs-section" id="obj-produto"><h2>02 · O que o produto deve se tornar</h2><p>Um <b>ERP / sistema operacional de força de trabalho de IA</b>. Empresas devem conseguir representar sua estrutura real dentro do ACTIS e alocar agentes como trabalhadores digitais.</p><div class="docs-code">EMPRESA\n├─ Comercial\n│  ├─ Atendimento\n│  ├─ Orçamentista\n│  └─ Follow-up\n├─ Financeiro\n│  ├─ Cobrança\n│  └─ Conciliação\n└─ Operações\n   ├─ PCP\n   └─ Compras</div><p>Cada agente deve ter responsabilidades claras, acesso apenas às capacidades necessárias e histórico auditável do que fez.</p></section>
<section class="docs-section" id="obj-agentes"><h2>03 · Agentes como entidades persistentes</h2><ul><li>identidade, função e aparência persistentes;</li><li>modelo configurável;</li><li>memória e contexto por empresa/setor/projeto;</li><li>tools e permissões granulares;</li><li>conversas independentes das Runs;</li><li>capacidade de delegar e receber tarefas de outros agentes;</li><li>estado operacional observável: idle, thinking, tool, blocked, waiting approval, completed.</li></ul></section>
<section class="docs-section" id="obj-orquestracao"><h2>04 · Orquestração</h2><p>O ACTIS deve permitir três formas complementares de trabalho:</p><ul><li><b>Conversa direta:</b> humano ↔ agente.</li><li><b>Delegação multiagente:</b> agente ↔ agente.</li><li><b>Workflows e automações:</b> execução coordenada sem intervenção constante do usuário.</li></ul><p>O World deve evoluir para uma visualização operacional real da rede de agentes, não apenas uma representação estética.</p></section>
<section class="docs-section" id="obj-integracoes"><h2>05 · Integrações</h2><p>O ACTIS GEN deve ser capaz de encaixar novos braços sem alterar o kernel: Browser, Files, Terminal, Computer Use, bancos, CRMs, ERPs, WhatsApp, e-mail, APIs e futuros MCPs.</p><div class="docs-note">Adicionar uma nova capacidade deve significar registrar um tool/harness e suas permissões — não criar outro sistema de agentes do zero.</div></section>
<section class="docs-section" id="obj-autonomia"><h2>06 · Autonomia com controle</h2><ul><li>automações recorrentes e condicionais;</li><li>workflows executáveis;</li><li>agentes capazes de agir sem supervisão contínua;</li><li>approvals humanos para capacidades sensíveis;</li><li>cancelamento, timeout e limites claros;</li><li>memória suficiente para continuidade entre sessões.</li></ul><p>Autonomia não significa liberdade irrestrita: toda ação relevante deve continuar observável, limitada por scopes e recuperável quando possível.</p></section>
<section class="docs-section" id="obj-confiabilidade"><h2>07 · Confiabilidade como requisito de produto</h2><p>Para o ACTIS virar infraestrutura real, uma Run não pode simplesmente desaparecer ou travar silenciosamente. O produto deve perseguir:</p><ul><li>Execution Engine única;</li><li>Event Bus e traces completos;</li><li>jobs duráveis e retomáveis;</li><li>idempotência para ações críticas;</li><li>retry controlado por política;</li><li>health checks de tools, modelos e serviços;</li><li>storage consistente e migrações versionadas;</li><li>testes de regressão para cada capability importante.</li></ul></section>
<section class="docs-section" id="obj-metas"><h2>08 · Metas</h2><table class="docs-table"><tr><th>Fase</th><th>Meta</th><th>Critério de sucesso</th></tr><tr><td>Agora</td><td>Consolidar kernel e operação local</td><td>Runs, memória, approvals, workflows, automações e tools funcionando sem caminhos paralelos.</td></tr><tr><td>Próxima</td><td>Agentes trabalhando em conjunto</td><td>Delegação, workflows, eventos e World refletindo atividade multiagente real.</td></tr><tr><td>Depois</td><td>Conectar softwares reais</td><td>Agentes operando CRM/ERP/WhatsApp/e-mail e sistemas internos por harnesses/APIs.</td></tr><tr><td>Produto</td><td>Multiempresa confiável</td><td>Auth, RBAC, isolamento de dados, auditoria e deployment reproduzível.</td></tr><tr><td>Visão final</td><td>Infraestrutura geral para trabalhadores digitais</td><td>Criar um agente útil passa a ser principalmente configurar função, contexto, modelo, tools e permissões.</td></tr></table><div class="docs-note"><b>Teste definitivo da visão:</b> se surgir um novo domínio, devemos conseguir criar agentes para ele sem construir um harness completo novo. O ACTIS deve reutilizar a infraestrutura existente e especializar apenas o necessário.</div></section>
</main></div></div>`}

function runLogText(r){return ['ACTIS GEN RUN LOG','id: '+(r.id||''),'status: '+(r.status||''),'agent_id: '+(r.agent_id||''),'model: '+(r.model||''),'source: '+(r.source||''),'conversation_id: '+(r.conversation_id||''),'automation_id: '+(r.automation_id||''),'started_at: '+(r.started_at||''),'finished_at: '+(r.finished_at||''),'elapsed_ms: '+(r.elapsed_ms??''),'prompt: '+(r.prompt||''),'response: '+(r.response||''),'error: '+(r.error||'')].join('\n')}
function runCard(r){const failed=r.status==='failed',running=r.status==='running',cancelled=r.status==='cancelled',planned=r.status==='planned',blocked=r.status==='blocked',log=runLogText(r),a=agents.find(x=>x.id===r.agent_id),showLog=failed||cancelled||planned||blocked;return `<div class="run ${failed?'failed':''} ${running?'running':''} ${cancelled?'cancelled':''} ${planned?'planned':''} ${blocked?'blocked':''}"><strong>${esc(runStatusLabel(r.status))}</strong><br><small>${esc(a?.name||r.agent_id||'')} · ${esc(r.model||'')} · ${r.elapsed_ms??'-'} ms</small><div>${esc((r.prompt||'').slice(0,180))}</div>${showLog&&r.error?`<div class="run-error">${esc(r.error)}</div>`:''}<div class="run-actions">${running?`<button class="mini run-stop" onclick="cancelRunUI('${esc(r.id)}',this)">■ Parar</button>`:''}${showLog?`<button class="mini" onclick="toggleRunLog(this)">Ver log</button><button class="mini" data-log="${esc(log)}" onclick="copyRunLog(this)">Copiar log</button>`:''}</div>${showLog?`<pre class="run-log">${esc(log)}</pre>`:''}</div>`}
function toggleRunLog(btn){const box=btn.closest('.run').querySelector('.run-log'),open=box.classList.toggle('open');btn.textContent=open?'Ocultar log':'Ver log'}
async function copyRunLog(btn){const text=btn.dataset.log||'';try{await navigator.clipboard.writeText(text)}catch(_){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=btn.textContent;btn.textContent='Copiado';setTimeout(()=>btn.textContent=old,1200)}
let statsState={period:'all'};

function renderCompanies(){stopWorld();currentView='companies';selected=null;title.textContent='Empresas';const unassigned=agents.filter(a=>!a.company_id);const body=companies.map(c=>{const companySectors=sectors.filter(s=>s.company_id===c.id),companyProjects=projects.filter(p=>p.company_id===c.id),companyAgents=agents.filter(a=>a.company_id===c.id),withoutSector=companyAgents.filter(a=>!a.sector_id);const projectRow=`<div class="org-world-projects"><span class="org-world-projects-label">PROJETOS</span>${companyProjects.map(p=>`<span class="org-world-project"><b>${esc(p.name)}</b><button class="mini context-btn" onclick="openContext('project','${p.id}')">Contexto</button></span>`).join('')||'<span class="muted" style="font-size:9px">nenhum projeto</span>'}</div>`;const sectorGroups=companySectors.map(s=>{const groupAgents=companyAgents.filter(a=>a.sector_id===s.id);return `<div class="org-world-sector org-dropzone" data-company="${esc(c.id)}" data-sector="${esc(s.id)}"><div class="org-world-sector-head"><strong>${esc(s.name)}</strong><span class="muted">${groupAgents.length}</span><div class="org-world-sector-actions"><button class="mini context-btn" onclick="openContext('sector','${s.id}')">Contexto</button><button class="mini" onclick="renameSector('${s.id}')">Renomear</button></div></div><div class="org-world-agents sector-agents">${groupAgents.map(companyAgentCard).join('')||'<span class="org-world-empty">Arraste um agente para cá</span>'}</div></div>`}).join('');const noSectorGroup=`<div class="org-world-sector org-dropzone" data-company="${esc(c.id)}" data-sector=""><div class="org-world-sector-head"><strong>Sem setor</strong><span class="muted">${withoutSector.length}</span></div><div class="org-world-agents sector-agents">${withoutSector.map(companyAgentCard).join('')||'<span class="org-world-empty">Arraste um agente para cá</span>'}</div></div>`;return `<section class="org-world-room company org-company-drop" style="--company-color:${esc(companyColor(c))}" async function moveOrgAgent(id,company_id,sector_id){const a=agents.find(x=>x.id===id);if(!a)return;if((a.company_id||null)===(company_id||null)&&(a.sector_id||null)===(sector_id||null))return;const j=await api('/api/agents/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({company_id:company_id||null,sector_id:sector_id||null})});agents=agents.map(x=>x.id===id?j.agent:x);renderCompanies()}

function contextScopeLabel(scopeType,scopeId){if(scopeType==='company')return companies.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='sector')return sectors.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='agent')return agents.find(x=>x.id===scopeId)?.name||scopeId;if(scopeType==='project')return projects.find(x=>x.id===scopeId)?.name||scopeId;return scopeId}

function contextItemHtml(item){return `<div class="context-item"><div><h4>${item.pinned?'📌 ':''}${esc(item.title)}</h4><p>${esc(item.content)}</p><div class="context-meta">${esc(item.kind)} · prioridade ${item.priority??50} · ${item.active===false?'inativo':'ativo'}</div></div><button class="mini danger" onclick="deleteContextItemUI('${item.id}','${item.scope_type}','${item.scope_id}')">Excluir</button></div>`}
async function saveContextItem(scopeType,scopeId){const title=document.querySelector('#ctxTitle')?.value.trim()||'',contentValue=document.querySelector('#ctxContent')?.value.trim()||'';if(!title||!contentValue){alert('Preencha título e conteúdo.');return}const body={scope_type:scopeType,scope_id:scopeId,kind:document.querySelector('#ctxKind').value,title,content:contentValue,priority:Number(document.querySelector('#ctxPriority').value||50),pinned:!!document.querySelector('#ctxPinned').checked};await api('/api/context-items',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});await openContext(scopeType,scopeId)}

function modelTier(model){const m=model.toLowerCase();const frontier=['gpt-6','gpt-5.6-sol','gpt-5.6-terra','claude-opus-5','grok-4.6','grok-4.5','gemini-3.8-pro','gemini-3.7-pro','deepseek-v4-pro','deepseek-pro','kimi-k3','qwen3.8-max','qwen3.7-max','glm-5.3','glm-5'];if(frontier.some(x=>m.includes(x)))return 'frontier';const strong=['gpt-5.6-luna','gpt-5.5','gpt-5.4','claude-sonnet-5','claude-sonnet-4.5','gemini-3.8-flash','gemini-3.7-flash','deepseek-v4','deepseek-3.2','qwen3.8','qwen3.7','qwen3-coder','kimi-k2.7','kimi-k2.6','kimi-k2.5','minimax-m3','minimax-m2.5','muse-glimmer-30b','nemotron-3.5-lightning'];if(strong.some(x=>m.includes(x)))return 'strong';const weak=[':free','-small','small','7b','8b','1.8b','lite','mini','flash-lite','contributor'];if(weak.some(x=>m.includes(x)))return 'weak';return 'medium'}
function tierLabel(t){return {frontier:'Frontier',strong:'Fortes',medium:'Médios',weak:'Fracos'}[t]||t}
function modelStatus(model){return modelHealth[model]?.status||'unknown'}
function modelRoute(model){return String(model||'').split('/')[0]||'other'}
function routeLabel(route){const labels={cx:'Codex',cl:'OpenRouter',gh:'GitHub',gc:'Gemini CLI',kimi:'Kimi',kr:'Kiro',cbai:'CodeBuddy',kiro:'Kiro'};return labels[route]||route.toUpperCase()}
function modelFamily(model){const raw=String(model||''),parts=raw.split('/');if(parts.length>=3)return parts[1];const name=(parts[1]||parts[0]||'').toLowerCase();if(name.includes('gpt'))return 'openai';if(name.includes('claude'))return 'anthropic';if(name.includes('gemini'))return 'google';if(name.includes('kimi'))return 'moonshot';if(name.includes('glm'))return 'z-ai';if(name.includes('deepseek'))return 'deepseek';return routeLabel(modelRoute(raw)).toLowerCase()}
function modelStatusLabel(st){return {working:'FUNCIONANDO',failing:'FALHANDO',unknown:'NÃO OBSERVADO'}[st]||String(st).toUpperCase()}
function filteredModels(){const q=modelExplorer.search.trim().toLowerCase();return models.filter(m=>{const st=modelStatus(m),tier=modelTier(m),route=modelRoute(m);if(modelExplorer.status!=='all'&&st!==modelExplorer.status)return false;if(modelExplorer.tier!=='all'&&tier!==modelExplorer.tier)return false;if(modelExplorer.route!=='all'&&route!==modelExplorer.route)return false;if(q&&!String(m).toLowerCase().includes(q)&&!modelFamily(m).includes(q)&&!routeLabel(route).toLowerCase().includes(q))return false;return true})}
function modelSummaryCard(value,label,kind=''){return `<div class="model-summary-card ${kind}"><b>${value}</b><span>${esc(label)}</span></div>`}
function modelRow(model){const st=modelStatus(model),tier=modelTier(model),route=modelRoute(model);return `<div class="model-row ${st}"><div class="model-row-status"><span class="model-state-dot"></span></div><div class="model-row-main"><strong title="${esc(model)}">${esc(model)}</strong><span>${esc(modelFamily(model))}</span></div><div class="model-row-route">${esc(routeLabel(route))}</div><div class="model-row-tier tier-text-${tier}">${esc(tierLabel(tier))}</div><div class="model-row-state">${esc(modelStatusLabel(st))}</div><div class="model-row-actions"><button class="mini" data-copy-model="${esc(model)}">Copiar</button>${st==='working'?`<button class="mini" data-new-agent-model="${esc(model)}">Novo agente</button>`:''}</div></div>`}
function modelGroupSection(key,list){if(!list.length)return '';const label=modelExplorer.group==='route'?routeLabel(key):tierLabel(key);return `<section class="model-explorer-group"><div class="model-explorer-group-head"><strong>${esc(label)}</strong><span>${list.length} modelo${list.length===1?'':'s'}</span></div><div class="model-table"><div class="model-table-head"><span></span><span>Modelo</span><span>Rota</span><span>Capacidade</span><span>Status</span><span>Ações</span></div>${list.map(modelRow).join('')}</div></section>`}
function renderModelResults(){const list=filteredModels();let html='';if(modelExplorer.group==='route'){const routes=[...new Set(list.map(modelRoute))].sort((a,b)=>routeLabel(a).localeCompare(routeLabel(b)));html=routes.map(r=>modelGroupSection(r,list.filter(m=>modelRoute(m)===r))).join('')}else{html=['frontier','strong','medium','weak'].map(t=>modelGroupSection(t,list.filter(m=>modelTier(m)===t))).join('')}return html||'<div class="model-no-results">Nenhum modelo corresponde aos filtros atuais.</div>'}
function providerCard(p){const tested=providerTest?.results?.find(r=>r.connectionId===p.id),ok=tested?tested.valid:(p.test_status==='active'?true:p.test_status==='unavailable'?false:null),cls=ok===true?'ok':ok===false?'bad':'unknown',label=ok===true?'CONECTADO':ok===false?'FALHANDO':'NÃO TESTADO',latency=tested?.latencyMs,detail=tested?.error||p.last_error||'';return `<div class="provider-card ${cls}"><div class="provider-card-top"><span class="provider-state-dot"></span><strong title="${esc(p.name||p.provider||'Conexão')}">${esc(p.name||p.provider||'Conexão')}</strong></div><div class="provider-route">${esc(p.provider||'')}</div><div class="provider-card-bottom"><span>${label}</span>${latency!=null?`<b>${Math.round(latency)} ms</b>`:''}</div>${detail?`<small>${esc(detail)}</small>`:''}</div>`}

function renderModels(reset=false,preserveFocus=false){stopWorld();currentView='models';selected=null;title.textContent='Modelos';if(reset)modelExplorer={status:'working',search:'',tier:'all',route:'all',group:'tier',providersOpen:false,providerProblemsOnly:false};const focused=document.activeElement?.id,selStart=document.activeElement?.selectionStart??null;const counts={working:0,failing:0,unknown:0};models.forEach(m=>counts[modelStatus(m)]++);const connected=providerConnections.filter(p=>p.test_status==='active').length,failedProviders=providerConnections.filter(p=>p.test_status==='unavailable'||p.last_error).length;const routes=[...new Set(models.map(modelRoute))].sort((a,b)=>routeLabel(a).localeCompare(routeLabel(b)));let providerList=[...providerConnections].sort((a,b)=>{const bad=x=>(x.test_status==='unavailable'||x.last_error)?0:1;return bad(a)-bad(b)||String(a.provider||'').localeCompare(String(b.provider||''))});if(modelExplorer.providerProblemsOnly)providerList=providerList.filter(p=>p.test_status==='unavailable'||p.last_error);const totalFiltered=filteredModels().length;content.innerHTML=`<div class="models-page"><div class="models-header"><div><h1>Modelos</h1><p>Catálogo operacional do 9Router. Por padrão, apenas modelos observados funcionando são exibidos.</p></div><div class="head-actions"><button id="probeModel">Teste independente</button><button id="testProviders">Testar providers</button></div></div><div class="model-summary-grid">${modelSummaryCard(counts.working,'funcionando','ok')}${modelSummaryCard(counts.failing,'falhando','bad')}${modelSummaryCard(counts.unknown,'não observados','muted')}${modelSummaryCard(connected,'providers conectados','blue')}${modelSummaryCard(failedProviders,'providers com problema',failedProviders?'bad':'muted')}</div><section class="providers-section ${modelExplorer.providersOpen?'open':''}"><button class="providers-toggle" id="toggleProviders"><span><b>Infra / Providers</b><small>9Router · ${providerConnections.length function channelKindLabel(kind){return({message:'MENSAGEM',decision:'DECISÃO',goal:'META',rule:'REGRA',note:'NOTA'})[kind]||String(kind||'').toUpperCase()}
function channelDate(value){if(!value)return'';try{return new Date(value).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return value}}
function channelScopeLabel(c){if(c.scope_type==='global')return'Todos os agentes';if(c.scope_type==='members')return'Membros escolhidos';if(c.scope_type==='company')return'Empresa';if(c.scope_type==='sector')return'Setor';return'Agente'}
async function loadChannelState(preferredId=null){const list=await api('/api/channels');channels=list.channels||[];let id=preferredId||channelState.current?.id||channels[0]?.id||null;if(id&&!channels.some(c=>c.id===id))id=channels[0]?.id||null;if(!id){channelState.current=null;channelState.messages=[];return}const detail=await api('/api/channels/'+encodeURIComponent(id)+'/messages');channelState.current=detail.channel;channelState.messages=detail.messages||[]}
function channelMessageHtml(m){const a=m.author_type==='agent'?agents.find(x=>x.id===m.author_id):null;return `<article class="channel-message ${m.long_term?'long-term':''} ${m.status!=='active'?'done':''}" data-channel-message="${esc(m.id)}"><div class="channel-avatar">${a?pixelMonster(a,'mini'):'<span class="channel-user-avatar">YOU</span>'}</div><div class="channel-message-main"><div class="channel-message-head"><b>${esc(m.author_name||'Você')}</b><span>${channelDate(m.created_at)}</span><em class="channel-kind ${esc(m.kind)}">${channelKindLabel(m.kind)}</em>${m.long_term?'<em class="channel-memory">LONGO PRAZO</em>':''}${m.pinned?'<em class="channel-pin">FIXADO</em>':''}</div><div class="channel-message-body">${esc(m.content||'')}</div><div class="channel-message-actions"><button class="mini" onclick="updateChannelMessage('${esc(m.id)}',{pinned:${m.pinned?'false':'true'}})">${m.pinned?'Desafixar':'Fixar'}</button><button class="mini" onclick="updateChannelMessage('${esc(m.id)}',{long_term:${m.long_term?'false':'true'}})">${m.long_term?'Remover do longo prazo':'Longo prazo'}</button>${m.long_term&&m.status==='active'?`<button class="mini" onclick="updateChannelMessage('${esc(m.id)}',{status:'done'})">Concluir</button>`:''}<button class="mini danger" onclick="deleteChannelMessage('${esc(m.id)}')">Apagar</button></div></div></article>`}
function channelLongTermHtml(){const items=channelState.messages.filter(m=>m.long_term&&m.status==='active');return items.map(m=>`<div class="channel-long-card ${esc(m.kind)}"><div><span>${channelKindLabel(m.kind)}</span>${m.pinned?'<b>FIXADO</b>':''}</div><p>${esc(m.content)}</p><small>${esc(m.author_name||'')} · ${channelDate(m.updated_at||m.created_at)}</small></div>`).join('')||'<div class="channel-empty">Nenhuma diretriz de longo prazo neste canal.</div>'}

async function renderChannels(){stopWorld();stopRunPolling();stopOpsTimer();currentView='channels';selected=null;title.textContent='Canais';try{await loadChannelState();const c=channelState.current;if(!c){content.innerHTML='<div class="empty">Nenhum canal disponível.</div>';return}const msgs=channelState.messages;content.innerHTML=`<div class="channels-page"><aside class="channels-list-panel"><div class="channels-list-head"><div><b>Canais</b><small>coordenação persistente</small></div><button id="newChannelBtn">＋</button></div><div class="channels-list">${channels.map(x=>`<button class="channel-list-item ${x.id===c.id?'active':''}" data-channel-id="${esc(x.id)}"><span>${esc(x.name)}</span><small>${x.long_term_count||0} longo prazo · ${x.member_count||0} membros</small></button>`).join('')}</div><div class="channels-explainer">Canais guardam decisões, metas e regras além da conversa atual.</div></aside><main class="channel-main"><header class="channel-head"><div><h1>${esc(c.name)}</h1><p>${esc(c.topic||'Sem tópico definido.')}</p></div><div class="channel-head-meta"><span>${channelScopeLabel(c)}</span>${c.name!=='#general'?'<button class="mini" id="deleteChannelBtn">Excluir</button>':''}</div></header><section class="channel-feed" id="channelFeed">${msgs.map(channelMessageHtml).join('')||'<div class="channel-empty big">Ainda não há mensagens neste canal.</div>'}</section><section class="channel-composer"><div class="channel-compose-tools"><select id="channelKind"><option value="message">Mensagem</option><option value="decision">Decisão</option><option value="goal">Meta</option><option value="rule">Regra</option><option value="note">Nota</option></select><label><input type="checkbox" id="channelLongTerm"> longo prazo</label><label><input type="checkbox" id="channelPinned"> fixar</label></div><textarea id="channelText" placeholder="Escreva para o canal. Decisões, metas e regras podem virar contexto persistente dos agentes..."></textarea><div class="channel-compose-actions"><select id="channelAgent"><option value="">Escolher agente...</option>${agents.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select><button id="channelAskAgent">Perguntar ao agente</button><span class="spacer"></span><button class="primary" id="channelPost">Postar</button></div></section></main><aside class="channel-context-panel"><section><div class="channel-side-head"><b>Longo prazo</b><span>${msgs.filter(m=>m.long_term&&m.status==='active').length}</span></div><div class="channel-long-list">${channelLongTermHtml()}</div></section><section class="channel-members-section"><div class="channel-side-head"><b>Agentes do canal</b>${c.scope_type==='members'?'<button class="mini" id="saveChannelMembers">Salvar</button>':'<span>todos herdam</span>'}</div><div class="channel-members-list">${channelMembersHtml()}</div></section></aside></div>`;bindChannelsUI();requestAnimationFrame(()=>{const feed=document.querySelector('#channelFeed');if(feed)feed.scrollTop=feed.scrollHeight})}catch(e){content.innerHTML=`<div class="empty">Falha ao carregar canais: ${esc(e.message)}</div>`}}
function bindChannelsUI(){document.querySelectorAll('[data-channel-id]').forEach(b=>b.onclick=async()=>{await loadChannelState(b.dataset.channelId);renderChannels()});const n=document.querySelector('#newChannelBtn');if(n)n.onclick=createChannelUI;const post=document.querySelector('#channelPost');if(post)post.onclick=postChannelMessage;const ask=document.querySelector('#channelAskAgent');if(ask)ask.onclick=invokeChannelAgent;const save=document.querySelector('#saveChannelMembers');if(save)save.onclick=saveChannelMembers;const del=document.querySelector('#deleteChannelBtn');if(del)del.onclick=deleteCurrentChannel;const text=document.querySelector('#channelText');if(text)text.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();postChannelMessage()}}}
async function createChannelUI(){const name=prompt('Nome do canal:');if(!name?.trim())return;const topic=prompt('Tópico / objetivo do canal:')||'';const j=await api('/api/channels',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,topic,scope_type:'members',members:[]})});await loadChannelState(j.channel.id);renderChannels()}

function openConnectorModal(id='',preset=null){const c=connectors.find(x=>x.id===id)||{kind:'http',enabled:true,agent_ids:['*'],capabilities:[],...(preset||{})};const builtin=!!c.builtin,all=(c.agent_ids||[]).includes('*');document.querySelector('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal connector-modal"><h2>${id?'Configurar conector':'Novo conector'}</h2><p class="muted">Secrets não são armazenados aqui. Informe o nome da variável de ambiente que contém a credencial.</p><div class="connector-form"><div class="field"><label>Nome</label><input id="connectorName" value="${esc(c.name||'')}"></div><div class="field"><label>Tipo</label><select id="connectorKind" ${builtin?'disabled':''}><option value="http" ${c.kind==='http'?'selected':''}>HTTP API</option><option value="nine_router" ${c.kind==='nine_router'?'selected':''}>9Router</option><option value="agent_bus" ${c.kind==='agent_bus'?'selected':''}>ACTIS Agent Bus</option></select></div><div class="field connector-wide"><label>Base URL / endereço</label><input id="connectorUrl" value="${esc(c.base_url||'')}" ${builtin?'disabled':''}></div><div class="field"><label>Autenticação</label><select id="connectorAuth" ${builtin?'disabled':''}><option value="none" ${c.auth_type==='none'?'selected':''}>Nenhuma</option><option value="api_key_env" ${c.auth_type==='api_key_env'?'selected':''}>API key via env</option><option value="bearer_env" ${c.auth_type==='bearer_env'?'selected':''}>Bearer via env</option><option value="internal" ${c.auth_type==='internal'?'selected':''}>Interna</option></select></div><div class="field"><label>Variável de credencial</label><input id="connectorCredential" value="${esc(c.credential_ref||'')}" placeholder="MINHA_API_KEY" ${builtin?'disabled':''}></div><div class="field connector-wide"><label>Capabilities (vírgula)</label><input id="connectorCaps" value="${esc((c.capabilities||[]).join(', '))}"></div><div class="field connector-wide"><label><input type="checkbox" id="connectorEnabled" ${c.enabled?'checked':''}> Conector habilitado</label></div><div class="connector-agent-access connector-wide"><div class="connector-access-head"><b>Acesso dos agentes</b><label><input type="checkbox" id="connectorAllAgents" ${all?'checked':''}> Todos</label></div><div class="connector-agent-grid">${agents.map(a=>`<label><input type="checkbox" data-connector-agent="${esc(a.id)}" ${all||(c.agent_ids||[]).includes(a.id)?'checked':''} ${all?'disabled':''}> ${esc(a.name)}</label>`).join('')||'<span class="muted">Nenhum agente criado.</span>'}</div></div></div><div class="modal-actions"><button onclick="closeModal()">Cancelar</button><button class="primary" id="saveConnector">Salvar</button></div></div></div>`;document.querySelector('#connectorAllAgents').onchange=e=>document.querySelectorAll('[data-connector-agent]').forEach(x=>{x.disabled=e.target.checked;if(e.target.checked)x.checked=true});document.querySelector('#saveConnector').onclick=()=>saveConnectorUI(id,c)}
async function saveConnectorUI(id,current){const all=document.querySelector('#connectorAllAgents').checked,agent_ids=all?['*']:[...document.querySelectorAll('[data-connector-agent]:checked')].map(x=>x.dataset.connectorAgent),body={id:id||undefined,name:document.querySelector('#connectorName').value.trim(),kind:current.builtin?current.kind:document.querySelector('#connectorKind').value,base_url:document.querySelector('#connectorUrl').value.trim(),auth_type:document.querySelector('#connectorAuth').value,credential_ref:document.querySelector('#connectorCredential').value.trim(),enabled:document.querySelector('#connectorEnabled').checked,agent_ids,capabilities:document.querySelector('#connectorCaps').value.split(',').map(x=>x.trim()).filter(Boolean)};await api(id?'/api/connectors/'+encodeURIComponent(id):'/api/connectors',{method:id?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});closeModal();await renderConnectors()}
async function deleteConnectorUI(id){if(!confirm('Excluir este conector?'))return;await api('/api/connectors/'+encodeURIComponent(id),{method:'DELETE'});delete connectorHealth[id];await renderConnectors()}

const navigationSections={
  world:{label:'World',items:[['world','Visão geral'],['agents','Agentes']]},
  operation:{label:'Operação',items:[['channels','Canais'],['runs','Execuções'],['approvals','Aprovações'],['events','Eventos']]},
  companies:{label:'Empresas',items:[['companies','Empresas']]},
  automation:{label:'Automação',items:[['automations','Automações'],['workflows','Workflows']]},
  system:{label:'Sistema',items:[['models','Modelos'],['tools','Ferramentas'],['connectors','Config'],['stats','Estatísticas'],['about','Sobre'],['objective','Objetivo']]}
};
function navRootForView(view){
  for(const [root,section] of Object.entries(navigationSections))if(section.items.some(([id])=>id===view))return root;
  return'world';
}
function applySectionNavigation(){
  const root=navRootForView(currentView),section=navigationSections[root],existing=content.querySelector(':scope > .section-nav');
  setNavigationPage(currentView);
  if(!section||section.items.length<=1){existing?.remove();return}
  if(existing?.dataset.navRoot===root){existing.querySelectorAll('[data-section-view]').forEach(b=>b.classList.toggle('active',b.dataset.sectionView===currentView));return}
  existing?.remove();
  const bar=document.createElement('nav');bar.className='section-nav';bar.dataset.navRoot=root;bar.setAttribute('aria-label',section.label);
  bar.innerHTML=`<span class="section-nav-label">${esc(section.label)}</span>${section.items.map(([view,label])=>`<button data-section-view="${esc(view)}" class="${view===currentView?'active':''}">${esc(label)}</button>`).join('')}`;
  content.prepend(bar);bar.querySelectorAll('[data-section-view]').forEach(b=>b.onclick=()=>navigateTo(b.dataset.sectionView));
}
let sectionNavScheduled=false;
new MutationObserver(()=>{if(sectionNavScheduled)return;sectionNavScheduled=true;requestAnimationFrame(()=>{sectionNavScheduled=false;applySectionNavigation()})}).observe(content,{childList:true});

  {view:'world',label:'World',group:'Principal',keywords:'home mundo visual agentes empresas setores'},

  {view:'approvals',label:'Aprovações',group:'Operação',keywords:'permissões confirmar scopes'},
  {view:'events',label:'Eventos',group:'Operação',keywords:'logs timeline console'},
  {view:'companies',label:'Empresas',group:'Empresas',keywords:'organização setores projetos'},
  {view:'automations',label:'Automações',group:'Automação',keywords:'gatilhos agenda recorrência'},
  {view:'workflows',label:'Workflows',group:'Automação',keywords:'fluxos canvas processos'},

let commandPaletteIndex=0;
function closeCommandPalette(){document.querySelector('#commandPaletteRoot').innerHTML=''}
function commandPaletteMatches(query=''){const q=normalizedSearch(query);return commandPaletteItems.filter(item=>!q||normalizedSearch([item.label,item.group,item.keywords||''].join(' ')).includes(q))}
function renderCommandPaletteList(query=''){
  const list=document.querySelector('#commandPaletteList');if(!list)return;const items=commandPaletteMatches(query);commandPaletteIndex=Math.max(0,Math.min(commandPaletteIndex,Math.max(0,items.length-1)));
  list.innerHTML=items.map((item,index)=>`<button class="command-item ${index===commandPaletteIndex?'active':''}" data-command-index="${index}"><span><b>${esc(item.label)}</b><small>${esc(item.group)}</small></span><kbd>↵</kbd></button>`).join('')||'<div class="command-empty">Nenhuma função encontrada.</div>';
  list.querySelectorAll('[data-command-index]').forEach(b=>{b.onmouseenter=()=>{commandPaletteIndex=Number(b.dataset.commandIndex);renderCommandPaletteList(document.querySelector('#commandPaletteSearch')?.value||'')};b.onclick=()=>runCommandPaletteItem(items[Number(b.dataset.commandIndex)])});
}
function runCommandPaletteItem(item){if(!item)return;closeCommandPalette();if(item.id==='new-agent'){newAgentModal();return}if(item.view)navigateTo(item.view)}
function openCommandPalette(){
  commandPaletteIndex=0;const root=document.querySelector('#commandPaletteRoot');root.innerHTML=`<div class="command-backdrop"><div class="command-palette" role="dialog" aria-modal="true" aria-label="Comandos do ACTIS"><div class="command-search-wrap"><span>⌕</span><input id="commandPaletteSearch" autocomplete="off" placeholder="Ir para uma tela ou executar uma ação…"><kbd>ESC</kbd></div><div id="commandPaletteList" class="command-list"></div><div class="command-footer"><span>↑ ↓ navegar</span><span>Enter abrir</span><span>Ctrl K fechar</span></div></div></div>`;
  const input=document.querySelector('#commandPaletteSearch');renderCommandPaletteList('');input.focus();input.oninput=()=>{commandPaletteIndex=0;renderCommandPaletteList(input.value)};input.onkeydown=e=>{const items=commandPaletteMatches(input.value);if(e.key==='ArrowDown'){e.preventDefault();commandPaletteIndex=Math.min(commandPaletteIndex+1,items.length-1);renderCommandPaletteList(input.value)}else if(e.key==='ArrowUp'){e.preventDefault();commandPaletteIndex=Math.max(commandPaletteIndex-1,0);renderCommandPaletteList(input.value)}else if(e.key==='Enter'){e.preventDefault();runCommandPaletteItem(items[commandPaletteIndex])}else if(e.key==='Escape'){e.preventDefault();closeCommandPalette()}};
  root.querySelector('.command-backdrop').onclick=e=>{if(e.target===e.currentTarget)closeCommandPalette()};
}
function prepareNavigationChange(){stopRunPolling();stopBrowserPanel();stopOpsTimer();stopWorld()}
async function navigateTo(view,{history=true,scroll=true}={}){
  const target=pageRenderers[view]?view:'world';currentView=target;setNavigationPage(target);prepareNavigationChange();if(scroll){content.scrollTop=0;content.scrollLeft=0}document.querySelector('.app').classList.remove('nav-open');syncNavigation();
  if(history&&location.hash!=='#'+target)window.history.replaceState(null,'','#'+target);await Promise.resolve(pageRenderers[target]());requestAnimationFrame(applySectionNavigation);
}
async function probeIndependentModel(){const b=document.querySelector('#probeModel');const m=models.find(x=>modelStatus(x)==='working')||models[0];const id=m?.model||m?.id||'';if(!id){alert('Nenhum modelo disponível.');return}if(b){b.disabled=true;b.textContent='Testando '+id+'…'}try{const j=await api('/api/model-probe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:id})});alert(j.ok?'Probe OK: '+j.model:'Resposta inesperada: '+j.text)}catch(e){alert('Probe falhou: '+e.message)}finally{if(b){b.disabled=false;b.textContent='Teste independente'}}}
async function testProviderConnections(){const b=document.querySelector('#testProviders');if(b){b.disabled=true;b.textContent='Testando no 9Router…'}try{providerTest=await api('/api/provider-connections/test',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});providerConnections=(await api('/api/provider-connections')).connections;renderModels()}catch(e){alert(e.message);renderModels()}}
function animateRefreshWave(){
  const bots=[...document.querySelectorAll('.grok-bot')].filter(bot=>{const r=bot.getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom>0&&r.top<window.innerHeight});
  bots.forEach((bot,index)=>{bot.classList.remove('refresh-pop');bot.style.setProperty('--refresh-delay',`${index*70}ms`);void bot.offsetWidth;bot.classList.add('refresh-pop')});
  const duration=760+bots.length*70;
  window.setTimeout(()=>bots.forEach(bot=>{bot.classList.remove('refresh-pop');bot.style.removeProperty('--refresh-delay')}),duration);
  return duration;
}
async function handleGlobalRefresh(){
  const button=document.querySelector('#refresh'),old=button.textContent;
  button.disabled=true;button.classList.add('refreshing');button.textContent='Sincronizando…';
  const action=currentView==='world'?refreshWorld:currentView==='channels'?renderChannels:currentView==='whatsapp'?renderWhatsApp:currentView==='automations'?renderAutomations:currentView==='workflows'?renderWorkflows:currentView==='approvals'?renderApprovals:currentView==='events'?renderEvents:currentView==='stats'?renderStats:currentView==='runs'?renderRuns:currentView==='models'?renderModels:currentView==='tools'?renderTools:currentView==='connectors'?renderConnectors:currentView==='companies'?renderCompanies:currentView==='about'?renderAbout:currentView==='objective'?renderObjective:selected?()=>openAgent(selected.id):renderAgents;
  try{await syncAgentCatalog({refresh:false});await Promise.resolve(action());requestAnimationFrame(()=>requestAnimationFrame(()=>animateRefreshWave()))}
  finally{window.setTimeout(()=>{button.disabled=false;button.classList.remove('refreshing');button.textContent=old},520)}
}
document.querySelector('#newAgent').onclick=newAgentModal;document.querySelector('#refresh').onclick=handleGlobalRefresh;
function setNavigationPage(view){const root=navRootForView(view);document.querySelectorAll('.nav button').forEach(b=>{const active=b.dataset.navRoot===root;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
const compactNavQuery=window.matchMedia('(max-width: 760px)');
let navCollapsed=false;
try{navCollapsed=localStorage.getItem('actis.nav.collapsed')==='1'}catch(_){}
function syncNavigation(){
  const app=document.querySelector('.app'),button=document.querySelector('#toggleNav');
  app.classList.toggle('nav-collapsed',navCollapsed&&!compactNavQuery.matches);
  const expanded=compactNavQuery.matches?app.classList.contains('nav-open'):!navCollapsed;
  button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',expanded?'Recolher navegação':'Abrir navegação');button.title=expanded?'Recolher navegação':'Abrir navegação';
}
document.querySelector('#toggleNav').onclick=()=>{
  if(compactNavQuery.matches)document.querySelector('.app').classList.toggle('nav-open');
  else{navCollapsed=!navCollapsed;try{localStorage.setItem('actis.nav.collapsed',navCollapsed?'1':'0')}catch(_){}}
  syncNavigation();
};
compactNavQuery.addEventListener('change',()=>{document.querySelector('.app').classList.remove('nav-open');syncNavigation()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(document.querySelector('#commandPaletteRoot').children.length)closeCommandPalette();else openCommandPalette();return}if(e.key==='Escape'&&document.querySelector('.app').classList.contains('nav-open')){document.querySelector('.app').classList.remove('nav-open');syncNavigation();document.querySelector('#toggleNav').focus()}});
const pageRenderers={agents:renderAgents,world:renderWorld,channels:renderChannels,whatsapp:renderWhatsApp,automations:renderAutomations,workflows:renderWorkflows,approvals:renderApprovals,events:renderEvents,stats:renderStats,runs:renderRuns,models:renderModels,tools:renderTools,connectors:renderConnectors,companies:renderCompanies,about:renderAbout,objective:renderObjective};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>navigateTo(b.dataset.view));
syncNavigation();
bindMonsterEyeTracking();
load();
