[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meuharness"
version = "0.0.1"
description = "General-purpose agent harness with pluggable runtime adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ricardo"}]
dependencies = [
  "agent-framework>=1,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
meuharness-smoke = "meuharness.smoke:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11"
]

[tool.hatch.build.targets.wheel]
packages = ["src/meuharness"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
