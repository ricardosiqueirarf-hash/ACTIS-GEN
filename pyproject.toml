[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "actis-gen"
version = "0.1.0"
description = "ACTIS GEN - general-purpose agent harness with pluggable runtime adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ricardo"}]
dependencies = [
  "agent-framework-core==1.18.0",
  "agent-framework-openai==1.14.3",
  "openai==3.13.0",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
]

[project.scripts]
actis-gen = "meuharness.cli:main"
actis-gen-web = "meuharness.web:main"
actis-gen-smoke = "meuharness.smoke:main"
actis-gen-scheduler = "meuharness.automation_scheduler:main"
meuharness = "meuharness.cli:main"
meuharness-web = "meuharness.web:main"
meuharness-smoke = "meuharness.smoke:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/meuharness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
